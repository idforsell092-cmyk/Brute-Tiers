<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>BRUTE TIERS - Festive Edition</title>

    <meta property="og:title" content="BRUTE TIERS - Festive Rankings" />
    <meta property="og:description" content="View Minecraft's best combat players in a festive Christmas edition!" />
    <meta property="og:image" content="https://brute-tiers.vercel.app/logo.png?v=2" />
    <meta property="og:url" content="https://brute-tiers.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#166534" />
    <meta name="twitter:card" content="summary_large_image" />

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-main: #0a2316;
            --bg-input: #113824;
            --accent: #22c55e;
            --discord: #5865F2;
            --text-dark: #0f172a;
            --border: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background: #06190e;
        }

        body {
            background: radial-gradient(circle at top, #144229 0%, #082113 70%, #030d07 100%);
            background-attachment: fixed;
            color: #ffffff;
            padding: 12px;
            min-height: 100vh;
            position: relative;
        }

        .snowfall-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: radial-gradient(4px 4px at 100px 50px, #fff, rgba(0,0,0,0)), 
                              radial-gradient(3px 3px at 200px 150px, #fff, rgba(0,0,0,0)), 
                              radial-gradient(4px 4px at 300px 250px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                              radial-gradient(3px 3px at 400px 350px, rgba(255,255,255,0.9), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 500px;
            opacity: 0.35;
            z-index: 1;
        }

        header, .search-filter-bar, .podium-container, .podium-divider-strip, .kit-bar, .leaderboard, .admin-panel, footer {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto 15px auto;
            position: relative;
            z-index: 2;
        }

        .christmas-title-banner {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .christmas-title-text {
            font-size: 2.8rem;
            font-weight: 900;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 20px rgba(34, 197, 94, 0.4);
            display: inline-block;
            position: relative;
        }

        .christmas-title-text::before {
            content: '🎅';
            position: absolute;
            top: -24px;
            left: -20px;
            font-size: 2.2rem;
            transform: rotate(-20deg);
        }

        .christmas-title-text::after {
            content: '🔔 🍬 🔔';
            display: block;
            font-size: 1rem;
            letter-spacing: 6px;
            margin-top: -5px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: #ffffff; letter-spacing: 1px; }
        .logo span { color: #ef4444; }

        .header-btns {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(90deg, #15803d 0%, #22c55e 100%);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
        }

        .btn-discord { 
            background: var(--discord); 
            padding-left: 28px;
        }

        .btn-discord::before {
            content: '🎅';
            position: absolute;
            left: 6px;
            top: -6px;
            font-size: 1rem;
        }

        .btn-logout { background: #ef4444; display: none; }

        .search-filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box { flex: 1 1 200px; }
        .search-box input, .region-filter select, .platform-filter select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(15, 56, 34, 0.85);
            border: 1px solid #166534;
            border-radius: 8px;
            color: white;
            backdrop-filter: blur(4px);
            font-size: 0.9rem;
        }

        .region-filter, .platform-filter { flex: 0 0 120px; }

        /* Podium Styles */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            margin: 20px auto 10px auto;
            padding: 10px;
            flex-wrap: wrap;
        }

        .podium-card {
            background: rgba(15, 56, 34, 0.85);
            border: 2px solid #22c55e;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
            cursor: pointer;
            backdrop-filter: blur(6px);
        }

        .podium-card:hover { transform: translateY(-5px); }

        .podium-card.rank-1 {
            order: 2;
            width: 220px;
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.25) 0%, rgba(15, 56, 34, 0.9) 100%);
            border-color: #fbbf24;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.4);
            z-index: 3;
        }

        .podium-card.rank-2 {
            order: 1;
            width: 190px;
            background: linear-gradient(180deg, rgba(148, 163, 184, 0.25) 0%, rgba(15, 56, 34, 0.9) 100%);
            border-color: #cbd5e1;
            box-shadow: 0 0 20px rgba(203, 213, 225, 0.3);
            z-index: 2;
        }

        .podium-card.rank-3 {
            order: 3;
            width: 190px;
            background: linear-gradient(180deg, rgba(249, 115, 22, 0.25) 0%, rgba(15, 56, 34, 0.9) 100%);
            border-color: #fb923c;
            box-shadow: 0 0 20px rgba(251, 146, 60, 0.3);
            z-index: 1;
        }

        .podium-crown {
            font-size: 2rem;
            position: absolute;
            top: -22px;
        }

        .podium-avatar-box {
            width: 80px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .podium-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .podium-card.rank-1 .podium-avatar-box { width: 95px; height: 110px; }

        .podium-info h3 { font-size: 1rem; font-weight: 800; color: #ffffff; margin-bottom: 2px; }
        .podium-info p { font-size: 0.75rem; color: #cbd5e1; font-weight: 700; margin-bottom: 6px; }
        .podium-points { font-size: 0.8rem; font-weight: 900; color: #86efac; background: rgba(34, 197, 94, 0.2); padding: 2px 8px; border-radius: 6px; display: inline-block; }
    </style>
</head>
<body>

    <div class="snowfall-bg"></div>

    <div class="christmas-title-banner">
        <div class="christmas-title-text">BRUTETIERS</div>
    </div>

    <header>
        <div class="logo">BRUTE<span>TIERS</span></div>
        <div class="header-btns">
            <a href="https://discord.gg/BAjzj8qmmk" target="_blank" class="btn btn-discord">Discord</a>
            <button class="btn" id="adminToggleBtn" onclick="toggleAdmin()">⚙ Admin</button>
            <button class="btn btn-logout" id="logoutBtn" onclick="logoutAdmin()">Logout</button>
        </div>
    </header>

    <div class="search-filter-bar">
        <div class="search-box">
            <input type="text" id="searchPlayer" placeholder="Search player..." oninput="renderLeaderboard()">
        </div>
        <div class="platform-filter">
            <select id="filterPlatform" onchange="renderLeaderboard()">
                <option value="ALL">All Platforms</option>
                <option value="PC">PC</option>
                <option value="Pojav">Pojav</option>
            </select>
        </div>
        <div class="region-filter">
            <select id="filterRegion" onchange="renderLeaderboard()">
                <option value="ALL">All Regions</option>
                <option value="IND">IND</option>
                <option value="NA">NA</option>
                <option value="EU">EU</option>
                <option value="ASIA">ASIA</option>
                <option value="PAK">PAK</option>
                <option value="NEP">NEP</option>
            </select>
        </div>
    </div>

    <!-- Top 3 Podium Showcase Section -->
    <div class="podium-container" id="podiumContainer"></div>

    <!-- Festive Divider Strip -->
    <div class="podium-divider-strip" id="podiumDivider"></div>

    <!-- Kit Bar -->
    <div class="kit-bar" id="kitBar"></div>

    <div class="admin-panel" id="adminPanel">
        <h2>Admin Management Panel</h2>
        
        <!-- Add Gamemode Sub-Section -->
        <div style="background: rgba(6, 36, 20, 0.6); padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #22c55e;">
            <h3 style="font-size: 0.95rem; margin-bottom: 8px; color: #86efac;">➕ Add New Gamemode</h3>
            <form id="gamemodeForm" onsubmit="addNewGamemode(event)" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                <div style="flex: 1 1 150px;">
                    <input type="text" id="newGamemodeName" placeholder="Gamemode Name (e.g. Cart)" required>
                </div>
                <div style="flex: 1 1 180px;">
                    <input type="file" id="newGamemodeIcon" accept="image/*" required onchange="handleNewGamemodeIcon(event)">
                    <input type="hidden" id="newGamemodeIconBase64">
                </div>
                <div>
                    <button type="submit" class="btn" style="padding: 9px 16px;">Add Gamemode</button>
                </div>
            </form>
        </div>

        <form id="playerForm">
            <input type="hidden" id="editIndex">
            <div class="form-grid">
                <div><label>Username</label><input type="text" id="username" required></div>
                <div><label>Platform</label>
                    <select id="platform">
                        <option value="PC">PC</option>
                        <option value="Pojav">Pojav</option>
                    </select>
                </div>
                <div><label>Region</label><input type="text" id="region"></div>
                <div><label>Skin PNG Upload</label><input type="file" id="skinFileInput" accept="image/*" onchange="handleSkinUpload(event)"><input type="hidden" id="customSkinBase64"></div>
            </div>
            <div class="tier-inputs" id="tierInputsContainer"></div>
            <button type="submit" class="btn" id="saveBtn" style="width: 100%;">Save Player</button>
        </form>
        <div class="representatives-grid" id="representativesManager" style="margin-top:15px;"></div>
    </div>

    <div class="leaderboard" id="leaderboard"></div>

    <footer>
        <div class="christmas-footer-graphic">🐺 🎄 🎁 🐴</div>
        <div class="christmas-footer-text">Merry Minecraft Christmas from Brute Tiers!</div>
    </footer>

    <div class="modal-overlay" id="statsModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-header">
                <img id="modalAvatar" class="modal-avatar" src="" alt="Avatar">
                <div>
                    <h3 id="modalUsername"></h3>
                    <p id="modalTitle"></p>
                </div>
            </div>
            <div class="modal-stats-grid" id="modalStatsGrid"></div>
        </div>
    </div>
        <style>
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: #0f3822;
            border: 1px solid #22c55e;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
            color: white;
        }

        .modal-close { position: absolute; top: 10px; right: 10px; background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .modal-avatar { 
            width: 60px; 
            height: 70px; 
            border-radius: 6px; 
            image-rendering: pixelated; 
            object-fit: contain; 
            background: rgba(0,0,0,0.2); 
            padding: 2px;
        }
        .modal-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .modal-stat-box { background: var(--bg-input); padding: 8px; border-radius: 6px; display: flex; justify-content: space-between; font-size: 0.8rem; }
    </style>
</head>
        <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9AWX1TEymQXn20Ech-ZZVXQsRwS35kzY",
            authDomain: "brute-tiers.firebaseapp.com",
            databaseURL: "https://brute-tiers-default-rtdb.firebaseio.com",
            projectId: "brute-tiers",
            storageBucket: "brute-tiers.firebasestorage.app",
            messagingSenderId: "35511970184",
            appId: "1:35511970184:web:6f796e44d8567bdfe8f23d",
            measurementId: "G-CVENNS4GJ6"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const globalRef = db.ref("brutetiers_data");
        const rootRef = db.ref();

        let ALL_CATEGORIES = ['Overall', 'Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        let KITS = ['Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        
        const TIERS = ['NA', 'HT1', 'LT1', 'HT2', 'LT2', 'HT3', 'LT3', 'HT4', 'LT4', 'HT5', 'LT5'];
        const ADMIN_PASS = "98909890";
        let isAdminLoggedIn = false;
        let selectedCategory = 'Overall';

        const TIER_ORDER = { 
            'HT1': 1, 'LT1': 2, 'HT2': 3, 'LT2': 4, 'HT3': 5, 
            'LT3': 6, 'HT4': 7, 'LT4': 8, 'HT5': 9, 'LT5': 10, 'NA': 99 
        };

        const TIER_SCORES = { 
            'HT1': 100, 'LT1': 90, 'HT2': 80, 'LT2': 70, 'HT3': 60, 
            'LT3': 50, 'HT4': 40, 'LT4': 30, 'HT5': 20, 'LT5': 10, 'NA': 0 
        };

        let appData = { kitIcons: {}, playersList: [] };
        let isDataLoaded = false;

        globalRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && (data.playersList || data.kitIcons)) {
                isDataLoaded = true;
                appData = {
                    kitIcons: data.kitIcons || {},
                    playersList: Array.isArray(data.playersList) ? data.playersList : []
                };
                if (Array.isArray(data.customCategories)) {
                    ALL_CATEGORIES = ['Overall', ...data.customCategories];
                    KITS = [...data.customCategories];
                }
                renderAll();
            } else {
                rootRef.once('value', (rootSnapshot) => {
                    isDataLoaded = true;
                    const rootVal = rootSnapshot.val() || {};
                    let recoveredList = [];

                    if (Array.isArray(rootVal.playersList)) {
                        recoveredList = rootVal.playersList;
                    } else if (Array.isArray(rootVal)) {
                        recoveredList = rootVal;
                    } else {
                        for (let key in rootVal) {
                            if (rootVal[key] && Array.isArray(rootVal[key].playersList)) {
                                recoveredList = rootVal[key].playersList;
                                break;
                            } else if (Array.isArray(rootVal[key])) {
                                recoveredList = rootVal[key];
                                break;
                            }
                        }
                    }

                    if (rootVal.customCategories && Array.isArray(rootVal.customCategories)) {
                        ALL_CATEGORIES = ['Overall', ...rootVal.customCategories];
                        KITS = [...rootVal.customCategories];
                    }

                    appData = {
                        kitIcons: rootVal.kitIcons || (rootVal.brutetiers_data ? rootVal.brutetiers_data.kitIcons : {}) || {},
                        playersList: recoveredList
                    };
                    renderAll();
                });
            }
        }, (error) => {
            console.error("Firebase Read Error:", error);
            isDataLoaded = true;
            renderAll();
        });

        function renderAll() {
            renderKitBar();
            renderKitRepsManager();
            buildTierInputs();
            renderPodium();
            renderLeaderboard();
        }

        async function saveGlobalData() {
            renderAll();
            try {
                const customCats = ALL_CATEGORIES.filter(c => c !== 'Overall');
                await globalRef.set({
                    kitIcons: appData.kitIcons || {},
                    playersList: appData.playersList || [],
                    customCategories: customCats
                });
            } catch (err) {
                console.error("Firebase Sync Error:", err);
            }
        }

        function toggleAdmin() {
            if (isAdminLoggedIn) {
                document.getElementById('adminPanel').classList.toggle('active');
            } else {
                if (prompt("Admin Password:") === ADMIN_PASS) {
                    isAdminLoggedIn = true;
                    document.getElementById('adminPanel').classList.add('active');
                    document.getElementById('adminToggleBtn').textContent = "⚙ Panel";
                    document.getElementById('logoutBtn').style.display = "inline-block";
                    renderLeaderboard();
                }
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminToggleBtn').textContent = "⚙ Admin";
            document.getElementById('logoutBtn').style.display = "none";
            renderLeaderboard();
        }

        function calculatePoints(playerTiers) {
            let total = 0;
            if (!playerTiers) return 0;
            KITS.forEach(kit => { total += TIER_SCORES[playerTiers[kit] || 'NA'] || 0; });
            return total;
        }

        function getDefaultTitleByRank(displayRank) {
            if (displayRank === 1) return 'Combat GrandMaster';
            if (displayRank === 2) return 'Combat GrandExpert';
            if (displayRank === 3) return 'Combat Expert';
            if (displayRank >= 4 && displayRank <= 10) return 'Combat Specialist';
            if (displayRank >= 11 && displayRank <= 50) return 'Combat Cadet';
            if (displayRank >= 51 && displayRank <= 100) return 'Experienced';
            return 'Rookie';
        }

        function renderKitBar() {
            document.getElementById('kitBar').innerHTML = ALL_CATEGORIES.map(cat => `
                <div class="kit-pill ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
                    ${appData.kitIcons && appData.kitIcons[cat] ? `<img src="${appData.kitIcons[cat]}">` : ''}
                    <span>${cat}</span>
                </div>
            `).join('');
        }

        function selectCategory(cat) { 
            if (selectedCategory === cat) return;
            selectedCategory = cat; 
            renderKitBar(); 
            renderPodium();
            renderLeaderboard();
        }

        function renderPodium() {
            const podiumContainer = document.getElementById('podiumContainer');
            const dividerStrip = document.getElementById('podiumDivider');
            
            if (!appData.playersList || appData.playersList.length === 0 || selectedCategory !== 'Overall') {
                podiumContainer.style.display = 'none';
                dividerStrip.style.display = 'none';
                return;
            }
            podiumContainer.style.display = 'flex';
            dividerStrip.style.display = 'block';

            let sortedList = [...appData.playersList].sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));
            const top3 = sortedList.slice(0, 3);

            if (top3.length === 0) {
                podiumContainer.innerHTML = '';
                dividerStrip.style.display = 'none';
                return;
            }

            let displayOrder = [];
            if (top3[1]) displayOrder.push({ player: top3[1], rank: 2 });
            if (top3[0]) displayOrder.push({ player: top3[0], rank: 1 });
            if (top3[2]) displayOrder.push({ player: top3[2], rank: 3 });

            podiumContainer.innerHTML = displayOrder.map(item => {
                const p = item.player;
                const rank = item.rank;
                const originalIndex = appData.playersList.indexOf(p);
                const pts = calculatePoints(p.tiers);
                const title = getDefaultTitleByRank(rank);
                const avatarImg = p.customSkin || `https://mc-heads.net/body/${p.username}/100`;

                return `
                    <div class="podium-card rank-${rank}" onclick="openModal(${originalIndex})">
                        ${rank === 1 ? `<div class="podium-crown">👑</div>` : ''}
                        <div class="podium-avatar-box">
                            <img src="${avatarImg}" alt="${p.username}" onerror="this.onerror=null; this.src='https://mc-heads.net/body/Steve/100';">
                        </div>
                        <div class="podium-info">
                            <h3>#${rank} ${p.username}</h3>
                            <p>${title}</p>
                            <span class="podium-points">${pts} Points</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard');

            if (!isDataLoaded) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#86efac; font-weight:700;">Loading players from database...</div>`;
                return;
            }

            if (!appData.playersList || appData.playersList.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#cbd5e1; font-weight:700;">No players found in database. Use Admin panel to add players!</div>`;
                return;
            }

            const searchQuery = document.getElementById('searchPlayer')?.value.toLowerCase().trim() || '';
            const selectedRegion = document.getElementById('filterRegion')?.value || 'ALL';
            const selectedPlatform = document.getElementById('filterPlatform')?.value || 'ALL';

            let displayList = appData.playersList.filter(p => {
                if (!p || !p.username) return false;
                const matchesName = p.username.toLowerCase().includes(searchQuery);
                const pRegion = (p.region || 'NA').trim().toUpperCase();
                const pPlatform = (p.platform || 'PC').trim();

                const matchesRegion = (selectedRegion === 'ALL' || pRegion === selectedRegion);
                const matchesPlatform = (selectedPlatform === 'ALL' || pPlatform.toLowerCase() === selectedPlatform.toLowerCase());

                return matchesName && matchesRegion && matchesPlatform;
            });

            if (selectedCategory === 'Overall') {
                displayList.sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));
            } else {
                displayList = displayList.filter(p => p.tiers && p.tiers[selectedCategory] && p.tiers[selectedCategory] !== 'NA');
                displayList.sort((a, b) => (TIER_ORDER[a.tiers[selectedCategory]] || 99) - (TIER_ORDER[b.tiers[selectedCategory]] || 99));
            }

            if (displayList.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:#cbd5e1;">No matching players found.</div>`;
                return;
            }

            container.innerHTML = displayList.map((player, index) => {

                        <div class="player-info">
                            <h3>${player.username}</h3>
                            <p>${title} (${points} Points)</p>

                        <div class="${regionClass}">${regionDisplay}</div>
                        <div class="tier-badges">

        function openModal(index) {
            const player = appData.playersList[index];
            if (!player) return;

            document.getElementById('modalUsername').textContent = player.username;
            const pts = calculatePoints(player.tiers);
            const displayRank = appData.playersList.indexOf(player) + 1;
            document.getElementById('modalTitle').textContent = `${getDefaultTitleByRank(displayRank)} • (${pts} Points) • [${player.platform || 'PC'}]`;
            document.getElementById('modalAvatar').src = player.customSkin || `https://mc-heads.net/body/${player.username}/100`;

            document.getElementById('modalStatsGrid').innerHTML = KITS.map(kit => `
                <div class="modal-stat-box">
                    <span>${kit}</span>
                    <span class="badge tier-${player.tiers ? player.tiers[kit] || 'NA' : 'NA'}">${player.tiers ? player.tiers[kit] || 'NA' : 'NA'}</span>
                </div>
            `).join('');

            document.getElementById('statsModal').classList.add('active');
        }

        function closeModal() { document.getElementById('statsModal').classList.remove('active'); }

                </div>

        }

        function handleNewGamemodeIcon(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 24;
                    canvas.height = 24;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 24, 24);
                    document.getElementById('newGamemodeIconBase64').value = canvas.toDataURL('image/png');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function addNewGamemode(e) {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const nameInput = document.getElementById('newGamemodeName');
            const iconBase64 = document.getElementById('newGamemodeIconBase64').value;
            const gmName = nameInput.value.trim();

            if (!gmName) return;

            if (ALL_CATEGORIES.includes(gmName)) {
                alert("Gamemode already exists!");
                return;
            }

            ALL_CATEGORIES.push(gmName);
            KITS.push(gmName);

            if (!appData.kitIcons) appData.kitIcons = {};
            if (iconBase64) {
                appData.kitIcons[gmName] = iconBase64;
            }

            nameInput.value = '';
            document.getElementById('newGamemodeIcon').value = '';
            document.getElementById('newGamemodeIconBase64').value = '';

            await saveGlobalData();
            alert(`Gamemode "${gmName}" added successfully!`);
        }
