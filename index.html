<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTE TIERS</title>
    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-card: #14161f;
            --bg-input: #1d1f2b;
            --accent: #a855f7;
            --accent-hover: #9333ea;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2a2d3d;
            --gold: #f59e0b;
            --silver: #9ca3af;
            --bronze: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 15px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 20px auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-logout {
            background: #ef4444;
            display: none;
        }

        .admin-panel {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .form-section-title {
            margin: 15px 0 10px 0;
            font-size: 1.1rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .file-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .file-upload-wrapper input[type="file"] {
            font-size: 0.8rem;
            padding: 6px;
        }

        .tier-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .tier-input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .representatives-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .rep-card-input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rep-icon-preview {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #000;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .kit-bar {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            justify-content: center;
        }

        .kit-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .kit-pill img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .leaderboard {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            display: grid;
            grid-template-columns: 180px 1fr 70px 2fr auto;
            align-items: center;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .player-card {
                grid-template-columns: 160px 1fr auto;
                grid-template-areas: 
                    "rank-badge info region"
                    "badges badges actions";
                gap: 10px;
            }
            .mctiers-badge-wrapper { grid-area: rank-badge; }
            .player-info { grid-area: info; }
            .region-badge { grid-area: region; }
            .tier-badges { grid-area: badges; }
            .actions { grid-area: actions; }
        }

        /* MCTiers Parallel Banner Shape */
        .mctiers-badge-wrapper {
            display: flex;
            align-items: center;
            height: 65px;
            width: 165px;
            background: #252836;
            transform: skewX(-15deg);
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .rank-number-box {
            width: 55px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            flex-shrink: 0;
        }

        .rank-number-box span {
            transform: skewX(15deg);
        }

        .rank-number-box.rank-1 { background: var(--gold); color: #000; }
        .rank-number-box.rank-2 { background: var(--silver); color: #000; }
        .rank-number-box.rank-3 { background: var(--bronze); color: #000; }
        .rank-number-box.rank-default { background: #34384a; color: #fff; }

        .skin-holder {
            width: 110px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .skin-unskew {
            transform: skewX(15deg);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skin-canvas, .skin-img {
            max-width: 100%;
            max-height: 120%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .player-info h3 {
            font-size: 1.1rem;
        }

        .player-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Dynamic Border colors for NA vs Other Regions */
        .region-badge {
            background: var(--bg-input);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid var(--border);
        }

        .region-badge.na-region {
            border-color: #ef4444;
            color: #ef4444;
        }

        .region-badge.other-region {
            border-color: #84cc16;
            color: #84cc16;
        }

        .tier-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .badge.HT1, .badge.HT2 { color: #f43f5e; border-color: #f43f5e44; }
        .badge.HT3, .badge.HT4, .badge.HT5 { color: #fb923c; border-color: #fb923c44; }
        .badge.LT1, .badge.LT2, .badge.LT3 { color: #38bdf8; border-color: #38bdf844; }
        .badge.LT4, .badge.LT5 { color: #a3e635; border-color: #a3e63544; }

        .actions {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            color: white;
        }

        .btn-edit { background: #3b82f6; }
        .btn-delete { background: #ef4444; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BRUTE<span>TIERS</span></div>
        <div>
            <button class="btn" id="adminToggleBtn" onclick="toggleAdmin()">⚙ Admin Login</button>
            <button class="btn btn-logout" id="logoutBtn" onclick="logoutAdmin()">Logout Admin</button>
        </div>
    </header>

    <div class="kit-bar" id="kitBar"></div>

    <div class="admin-panel" id="adminPanel">
        <h2>Admin Management Panel</h2>
        
        <form id="playerForm">
            <h3 class="form-section-title">Add / Edit Player</h3>
            <input type="hidden" id="editIndex">
            
            <div class="form-grid">
                <div>
                    <label>Minecraft Username</label>
                    <input type="text" id="username" placeholder="e.g. AxtherBhaii" required>
                </div>
                <div>
                    <label>Region</label>
                    <select id="region">
                        <option value="IND">IND</option>
                        <option value="NA">NA</option>
                        <option value="EU">EU</option>
                        <option value="ASIA">ASIA</option>
                    </select>
                </div>
                <div class="file-upload-wrapper">
                    <label>Player Skin (Upload Image File)</label>
                    <input type="file" id="skinFileInput" accept="image/*" onchange="handleSkinUpload(event)">
                    <input type="hidden" id="customSkinBase64">
                </div>
            </div>

            <h3 class="form-section-title">Kit Tiers</h3>
            <div class="tier-inputs" id="tierInputsContainer"></div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Save Player to Global Leaderboard</button>
        </form>

        <h3 class="form-section-title" style="margin-top: 25px;">Kit Representatives & Icons Settings</h3>
        <div class="representatives-grid" id="representativesManager"></div>
    </div>

    <div class="leaderboard" id="leaderboard"></div>

    <script>
        const KITS = ['Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        const TIERS = ['NA', 'HT1', 'HT2', 'HT3', 'HT4', 'HT5', 'LT1', 'LT2', 'LT3', 'LT4', 'LT5'];
        const ADMIN_PASS = "98909890";
        let isAdminLoggedIn = false;
        
        const TIER_SCORES = {
            'HT1': 125, 'HT2': 112, 'HT3': 100, 'HT4': 88, 'HT5': 75,
            'LT1': 62,  'LT2': 50,  'LT3': 38,  'LT4': 25, 'LT5': 12,
            'NA': 0
        };

        let kitIcons = JSON.parse(localStorage.getItem('brute_kit_icons')) || {};

        const defaultPlayers = [
            {
                username: "AxtherBhaii",
                region: "IND",
                customSkin: "",
                tiers: { Sword: "HT4", Axe: "HT3", NethPot: "LT1", DiaPot: "LT2", UHC: "HT4", Smp: "LT2", Lifesteal: "LT3", Mace: "NA", Crystal: "LT1" }
            },
            {
                username: "ItsNotWh1te",
                region: "IND",
                customSkin: "",
                tiers: { Sword: "LT2", Axe: "HT3", NethPot: "HT5", DiaPot: "LT3", UHC: "LT1", Smp: "LT4", Lifesteal: "LT3", Mace: "LT4", Crystal: "LT3" }
            },
            {
                username: "blatha",
                region: "IND",
                customSkin: "",
                tiers: { Sword: "HT5", Axe: "LT2", NethPot: "NA", DiaPot: "LT3", UHC: "LT3", Smp: "LT5", Lifesteal: "LT4", Mace: "NA", Crystal: "NA" }
            },
            { username: "sufrrlol", region: "NA", customSkin: "", tiers: { Sword: "LT3" } },
            { username: "RealElite_", region: "NA", customSkin: "", tiers: { Sword: "LT4" } },
            { username: "nexloft_playz", region: "NA", customSkin: "", tiers: { Sword: "LT4" } },
            { username: "RaiKOuu_", region: "NA", customSkin: "", tiers: { Sword: "LT4" } },
            { username: "EzLoad__", region: "NA", customSkin: "", tiers: { Sword: "LT4" } },
            { username: "ItzDoomsdayy", region: "NA", customSkin: "", tiers: { Sword: "LT5" } }
        ];

        let players = JSON.parse(localStorage.getItem('brute_tiers_data')) || defaultPlayers;

        function toggleAdmin() {
            if (isAdminLoggedIn) {
                document.getElementById('adminPanel').classList.toggle('active');
            } else {
                const pass = prompt("Enter Admin Password:");
                if (pass === ADMIN_PASS) {
                    isAdminLoggedIn = true;
                    document.getElementById('adminPanel').classList.add('active');
                    document.getElementById('adminToggleBtn').textContent = "⚙ Panel";
                    document.getElementById('logoutBtn').style.display = "inline-block";
                    renderLeaderboard();
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminToggleBtn').textContent = "⚙ Admin Login";
            document.getElementById('logoutBtn').style.display = "none";
            renderLeaderboard();
        }

        function handleSkinUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('customSkinBase64').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleKitIconUpload(kit, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    kitIcons[kit] = e.target.result;
                    localStorage.setItem('brute_kit_icons', JSON.stringify(kitIcons));
                    renderKitBar();
                    renderKitRepsManager();
                    renderLeaderboard();
                };
                reader.readAsDataURL(file);
            }
        }

        function buildTierInputs() {
            document.getElementById('tierInputsContainer').innerHTML = KITS.map(kit => `
                <div class="tier-input-group">
                    <label>${kit}</label>
                    <select id="tier-${kit}">
                        ${TIERS.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                </div>
            `).join('');
        }

        function renderKitBar() {
            document.getElementById('kitBar').innerHTML = KITS.map(kit => `
                <div class="kit-pill">
                    ${kitIcons[kit] ? `<img src="${kitIcons[kit]}" alt="${kit}">` : ''}
                    <span>${kit}</span>
                </div>
            `).join('');
        }

        function renderKitRepsManager() {
            document.getElementById('representativesManager').innerHTML = KITS.map(kit => `
                <div class="rep-card-input">
                    <img src="${kitIcons[kit] || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'36\' height=\'36\' fill=\'%231f202c\'/></svg>'}" class="rep-icon-preview">
                    <div style="flex-grow: 1;">
                        <label style="font-size:0.8rem; font-weight:bold; display:block;">${kit} Icon</label>
                        <input type="file" accept="image/*" onchange="handleKitIconUpload('${kit}', event)">
                    </div>
                </div>
            `).join('');
        }

        function calculatePoints(playerTiers) {
            let total = 0;
            KITS.forEach(kit => {
                total += TIER_SCORES[playerTiers[kit] || 'NA'] || 0;
            });
            return total;
        }

        function getTitle(points) {
            if (points >= 800) return 'Combat Grandmaster';
            if (points >= 500) return 'Combat GrandExpert';
            if (points >= 300) return 'Combat Expert';
            if (points >= 100) return 'Combat Specialist';
            return 'Rookie';
        }

        function renderLeaderboard() {
            players.sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));
            localStorage.setItem('brute_tiers_data', JSON.stringify(players));

            const container = document.getElementById('leaderboard');
            container.innerHTML = players.map((player, index) => {
                const points = calculatePoints(player.tiers);
                const title = getTitle(points);
                const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : 'rank-default';
                const regionClass = player.region === 'NA' ? 'na-region' : 'other-region';

                return `
                    <div class="player-card">
                        <div class="mctiers-badge-wrapper">
                            <div class="rank-number-box ${rankClass}">
                                <span>${index + 1}.</span>
                            </div>
                            <div class="skin-holder">
                                <div class="skin-unskew" id="skin-box-${index}"></div>
                            </div>
                        </div>
                        <div class="player-info">
                            <h3>${player.username}</h3>
                            <p>✦ ${title} (${points} Points)</p>
                        </div>
                        <div class="region-badge ${regionClass}">${player.region}</div>
                        <div class="tier-badges">
                            ${KITS.map(kit => {
                                const tier = player.tiers[kit];
                                const icon = kitIcons[kit];
                                return tier && tier !== 'NA' ? `
                                    <span class="badge ${tier}">
                                        ${icon ? `<img src="${icon}">` : `<span>${kit}:</span>`}
                                        ${tier}
                                    </span>` : '';
                            }).join('')}
                        </div>
                        ${isAdminLoggedIn ? `
                        <div class="actions">
                            <button class="btn-sm btn-edit" onclick="editPlayer(${index})">Edit</button>
                            <button class="btn-sm btn-delete" onclick="deletePlayer(${index})">X</button>
                        </div>` : ''}
                    </div>
                `;
            }).join('');

            players.forEach((player, index) => renderSkin(index, player.username, player.customSkin));
        }

        function renderSkin(index, username, customSkin) {
            const container = document.getElementById(`skin-box-${index}`);
            if (!container) return;

            if (customSkin && customSkin.trim() !== '') {
                const canvas = document.createElement('canvas');
                canvas.width = 16;
                canvas.height = 32;
                canvas.className = 'skin-canvas';
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false;

                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, 16, 32);
                    ctx.drawImage(img, 8, 8, 8, 8, 4, 0, 8, 8);
                    ctx.drawImage(img, 40, 8, 8, 8, 4, 0, 8, 8);
                    ctx.drawImage(img, 20, 20, 8, 12, 4, 8, 8, 12);
                    ctx.drawImage(img, 44, 20, 4, 12, 0, 8, 4, 12);
                    ctx.drawImage(img, 36, 52, 4, 12, 12, 8, 4, 12);
                    ctx.drawImage(img, 4, 20, 4, 12, 4, 20, 4, 12);
                    ctx.drawImage(img, 20, 52, 4, 12, 8, 20, 4, 12);
                };
                img.src = customSkin;
                container.innerHTML = '';
                container.appendChild(canvas);
            } else {
                const img = document.createElement('img');
                img.className = 'skin-img';
                img.src = `https://mc-heads.net/body/${username}/right`;
                img.onerror = () => { img.src = 'https://mc-heads.net/body/Steve/right'; };
                container.innerHTML = '';
                container.appendChild(img);
            }
        }

        document.getElementById('playerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const index = document.getElementById('editIndex').value;
            const username = document.getElementById('username').value.trim();
            const region = document.getElementById('region').value;
            const customSkin = document.getElementById('customSkinBase64').value;

            const tiers = {};
            KITS.forEach(kit => {
                tiers[kit] = document.getElementById(`tier-${kit}`).value;
            });

            const playerData = { username, region, customSkin, tiers };

            if (index !== '') {
                players[index] = playerData;
            } else {
                players.push(playerData);
            }

            document.getElementById('playerForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('customSkinBase64').value = '';
            toggleAdmin();
            renderLeaderboard();
        });

        function editPlayer(index) {
            if (!isAdminLoggedIn) return;
            const player = players[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('username').value = player.username;
            document.getElementById('region').value = player.region;
            document.getElementById('customSkinBase64').value = player.customSkin || '';

            KITS.forEach(kit => {
                document.getElementById(`tier-${kit}`).value = player.tiers[kit] || 'NA';
            });

            if (!document.getElementById('adminPanel').classList.contains('active')) {
                document.getElementById('adminPanel').classList.add('active');
            }
        }

        function deletePlayer(index) {
            if (!isAdminLoggedIn) return;
            if (confirm('Delete this player?')) {
                players.splice(index, 1);
                renderLeaderboard();
            }
        }

        buildTierInputs();
        renderKitBar();
        renderKitRepsManager();
        renderLeaderboard();
    </script>
</body>
</html>
