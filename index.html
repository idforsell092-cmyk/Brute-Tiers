<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>BRUTE TIERS - Realtime Leaderboard</title>

    <!-- Discord & Open Graph Meta Tags for Embed Preview -->
    <meta property="og:title" content="BRUTE TIERS - Rankings" />
    <meta property="og:description" content="View Minecraft's best combat players or participate in the ranked community!" />
    <meta property="og:image" content="https://brute-tiers.vercel.app/logo.png" />
    <meta property="og:url" content="https://brute-tiers.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#3b82f6" />
    
    <!-- Big Image Card Style for Discord -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Firebase SDKs for Universal Cross-Device Live Sync -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-input: #1e293b;
            --accent: #3b82f6;
            --discord: #5865F2;
            --discord-hover: #4752C4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background: #090d16;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #090d16 100%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 12px;
            min-height: 100vh;
        }

        header, .search-filter-bar, .kit-bar, .leaderboard, .admin-panel {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 15px auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: headerPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes headerPop {
            0% { opacity: 0; transform: translateY(-20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header-btns {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: 1px; color: #ffffff; }
        .logo span { color: var(--accent); text-shadow: 0 0 10px rgba(59, 130, 246, 0.6); }

        .btn {
            background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            will-change: transform;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .btn:active { transform: scale(0.95); }

        .btn-discord { background: var(--discord); }
        .btn-logout { background: #ef4444; display: none; }

        .search-filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            animation: elementPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s backwards;
        }

        .search-box { flex: 1 1 200px; }
        .search-box input, .region-filter select, .platform-filter select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            backdrop-filter: blur(4px);
            font-size: 0.9rem;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .search-box input:focus, .region-filter select:focus, .platform-filter select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .region-filter, .platform-filter { flex: 0 0 120px; }

        .admin-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: none;
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .admin-panel.active { display: block; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }

        input, select {
            width: 100%;
            padding: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .tier-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 10px; }
        .representatives-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 15px; }

        .rep-card-input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rep-icon-preview { width: 32px; height: 32px; border-radius: 4px; object-fit: contain; }

        .kit-bar {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 8px;
            background: var(--bg-card);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            -webkit-overflow-scrolling: touch;
            animation: elementPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s backwards;
        }

        @keyframes elementPop {
            0% { opacity: 0; transform: translateY(15px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .kit-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-input);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .kit-pill:hover {
            transform: translateY(-2px) scale(1.05);
            color: #ffffff;
        }

        .kit-pill.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.25);
            color: #ffffff;
            transform: scale(1.06);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .kit-pill img { width: 18px; height: 18px; object-fit: contain; }

        .leaderboard { 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .leaderboard.switching {
            opacity: 0;
            transform: translateY(8px) scale(0.99);
        }

        .player-card {
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            overflow: hidden;
            contain: content;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, border-color 0.25s ease;
            animation: cardFadePop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            animation-delay: calc(var(--card-index, 0) * 0.04s);
        }

        .player-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
            border-color: var(--accent);
        }

        .player-card:active { transform: scale(0.98); }

        @keyframes cardFadePop {
            0% { opacity: 0; transform: translateY(18px) scale(0.94); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .player-card.rank-card-1::after,
        .player-card.rank-card-2::after,
        .player-card.rank-card-3::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -150%;
            width: 50%;
            height: 220%;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.65) 45%,
                rgba(255, 255, 255, 0.95) 50%,
                rgba(255, 255, 255, 0.65) 55%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            animation: brightShineSweep 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 10;
        }

        @keyframes brightShineSweep {
            0% { left: -150%; }
            35% { left: 160%; }
            100% { left: 160%; }
        }

        .player-card.rank-card-1 {
            background: linear-gradient(90deg, #d97706 0%, #b45309 100%) !important;
            border: 1px solid #fef08a !important;
            color: #ffffff !important;
        }
        .player-card.rank-card-1 .player-info p { color: #fef3c7 !important; }

        .player-card.rank-card-2 {
            background: linear-gradient(90deg, #475569 0%, #64748b 100%) !important;
            border: 1px solid #cbd5e1 !important;
            color: #ffffff !important;
        }
        .player-card.rank-card-2 .player-info p { color: #f1f5f9 !important; }

        .player-card.rank-card-3 {
            background: linear-gradient(90deg, #ea580c 0%, #c2410c 100%) !important;
            border: 1px solid #ffedd5 !important;
            color: #ffffff !important;
        }
        .player-card.rank-card-3 .player-info p { color: #ffedd5 !important; }

        .crown-overlay {
            position: absolute;
            top: 2px;
            left: 8px;
            font-size: 1rem;
            z-index: 5;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mctiers-badge-wrapper {
            display: flex;
            align-items: center;
            height: 48px;
            width: 130px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            z-index: 2;
        }

        .rank-number-box {
            width: 45px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 900;
            color: #ffffff;
        }

        .skin-holder {
            width: 85px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        /* Adjusted for Bust/Upper Body Skin view */
        .head-avatar-img {
            width: 32px;
            height: 44px;
            object-fit: contain;
            image-rendering: pixelated;
            transition: transform 0.25s ease;
            border-radius: 2px;
        }

        .player-card:hover .head-avatar-img { transform: scale(1.15); }

        .player-info { flex: 1 1 150px; min-width: 140px; z-index: 2; }
        .player-info h3 { font-size: 1.1rem; font-weight: 800; word-break: break-word; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .player-info p { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }

        .region-badge, .platform-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #22c55e;
            color: #86efac;
            flex-shrink: 0;
            z-index: 2;
        }

        .region-badge.region-na {
            border: 1px solid #ef4444 !important;
            color: #fca5a5 !important;
        }

        .platform-badge {
            border: 1px solid #3b82f6;
            color: #93c5fd;
        }

        .platform-badge.pojav {
            border: 1px solid #a855f7;
            color: #e9d5ff;
        }

        .tier-badges { display: flex; flex-wrap: wrap; gap: 4px; flex: 2 1 200px; z-index: 2; }

        .badge {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--tier-color, #38bdf8);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--tier-color, #38bdf8);
            transition: transform 0.2s ease;
        }

        .badge:hover { transform: scale(1.1); }
        .badge img { width: 14px; height: 14px; object-fit: contain; }

        .badge.tier-HT1 { --tier-color: #ef4444; }
        .badge.tier-LT1 { --tier-color: #f87171; }
        .badge.tier-HT2 { --tier-color: #f97316; }
        .badge.tier-LT2 { --tier-color: #fb923c; }
        .badge.tier-HT3 { --tier-color: #f59e0b; }
        .badge.tier-LT3 { --tier-color: #fbbf24; }
        .badge.tier-HT4 { --tier-color: #eab308; }
        .badge.tier-LT4 { --tier-color: #fde047; }
        .badge.tier-HT5 { --tier-color: #84cc16; }
        .badge.tier-LT5 { --tier-color: #22c55e; }

        .actions { display: flex; gap: 4px; margin-left: auto; z-index: 2; }
        .btn-sm { padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; border: none; color: white; cursor: pointer; transition: transform 0.15s ease; }
        .btn-sm:hover { transform: scale(1.1); }
        .btn-edit { background: #3b82f6; }
        .btn-delete { background: #ef4444; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: #1e293b;
            border: 1px solid var(--accent);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .modal-close { position: absolute; top: 10px; right: 10px; background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; transition: transform 0.2s ease; }
        .modal-close:hover { transform: scale(1.2) rotate(90deg); }
        .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .modal-avatar { width: 50px; height: 50px; border-radius: 8px; image-rendering: pixelated; object-fit: cover; }
        .modal-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .modal-stat-box { background: var(--bg-input); padding: 8px; border-radius: 6px; display: flex; justify-content: space-between; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BRUTE<span>TIERS</span></div>
        <div class="header-btns">
            <a href="https://discord.gg/BAjzj8qmmk" target="_blank" class="btn btn-discord">Discord</a>
            <button class="btn" id="adminToggleBtn" onclick="toggleAdmin()">⚙ Admin</button>
            <button class="btn btn-logout" id="logoutBtn" onclick="logoutAdmin()">Logout</button>
        </div>
    </header>

    <div class="search-filter-bar">
        <div class="search-box">
            <input type="text" id="searchPlayer" placeholder="Search player..." oninput="renderLeaderboard()">
        </div>
        <div class="platform-filter">
            <select id="filterPlatform" onchange="renderLeaderboard()">
                <option value="ALL">All Platforms</option>
                <option value="PC">PC</option>
                <option value="Pojav">Pojav</option>
            </select>
        </div>
        <div class="region-filter">
            <select id="filterRegion" onchange="renderLeaderboard()">
                <option value="ALL">All Regions</option>
                <option value="IND">IND</option>
                <option value="NA">NA</option>
                <option value="EU">EU</option>
                <option value="ASIA">ASIA</option>
                <option value="PAK">PAK</option>
                <option value="NEP">NEP</option>
            </select>
        </div>
    </div>

    <div class="kit-bar" id="kitBar"></div>

    <div class="admin-panel" id="adminPanel">
        <h2>Admin Management Panel</h2>
        <form id="playerForm">
            <input type="hidden" id="editIndex">
            <div class="form-grid">
                <div><label>Username</label><input type="text" id="username" required></div>
                <div><label>Platform</label>
                    <select id="platform">
                        <option value="PC">PC</option>
                        <option value="Pojav">Pojav</option>
                    </select>
                </div>
                <div><label>Title</label><input type="text" id="customTitle"></div>
                <div><label>Region</label><input type="text" id="region"></div>
                <div><label>Skin PNG Upload</label><input type="file" id="skinFileInput" accept="image/*" onchange="handleSkinUpload(event)"><input type="hidden" id="customSkinBase64"></div>
            </div>
            <div class="tier-inputs" id="tierInputsContainer"></div>
            <button type="submit" class="btn" id="saveBtn" style="width: 100%;">Save Player</button>
        </form>
        <div class="representatives-grid" id="representativesManager" style="margin-top:15px;"></div>
    </div>

    <div class="leaderboard" id="leaderboard"></div>

    <div class="modal-overlay" id="statsModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-header">
                <img id="modalAvatar" class="modal-avatar" src="" alt="Avatar">
                <div>
                    <h3 id="modalUsername"></h3>
                    <p id="modalTitle"></p>
                </div>
            </div>
            <div class="modal-stats-grid" id="modalStatsGrid"></div>
        </div>
    </div>
