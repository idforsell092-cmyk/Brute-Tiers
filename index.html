<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTE TIERS</title>
    <style>
        :root {
            --bg-main: #2a1b28;
            --bg-card: rgba(48, 28, 45, 0.85);
            --bg-input: #3b2237;
            --accent: #f472b6;
            --accent-hover: #ec4899;
            --discord: #5865F2;
            --discord-hover: #4752C4;
            --text-main: #fce7f3;
            --text-muted: #fbcfe8;
            --border: #502d4b;
            --active-lime: #f472b6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f121d 0%, #381e33 50%, #221220 100%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 15px;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(244, 114, 182, 0.15) 1px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        header, .kit-bar, .leaderboard, .admin-panel {
            position: relative;
            z-index: 1;
        }

        header, .kit-bar {
            animation: fadeInTop 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInTop {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 20px auto;
        }

        .header-btns {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo { font-size: 1.8rem; font-weight: 800; letter-spacing: 1px; color: #fbcfe8; }
        .logo span { color: var(--accent); text-shadow: 0 0 10px rgba(244, 114, 182, 0.5); }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(244, 114, 182, 0.3);
        }

        .btn:hover { background: var(--accent-hover); }
        
        .btn-discord {
            background: var(--discord);
            box-shadow: 0 0 10px rgba(88, 101, 242, 0.3);
        }

        .btn-discord:hover {
            background: var(--discord-hover);
        }

        .btn-logout { background: #ef4444; display: none; }

        .admin-panel {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 20px;
            display: none;
        }

        .admin-panel.active {
            display: block;
            animation: cardPopIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .form-section-title {
            margin: 15px 0 10px 0;
            font-size: 1.1rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .file-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .file-upload-wrapper input[type="file"] { font-size: 0.8rem; padding: 6px; }

        .tier-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .tier-input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .representatives-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .rep-card-input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rep-icon-preview {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #1a0f18;
            object-fit: contain;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .rep-inputs-col {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
        }

        .rep-inputs-col input { padding: 5px 8px; font-size: 0.75rem; }

        .kit-bar {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            justify-content: center;
        }

        .kit-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            padding: 8px 14px;
            border-radius: 6px;
            border: 2px solid transparent;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            color: var(--text-muted);
        }

        .kit-pill:hover {
            border-color: rgba(244, 114, 182, 0.4);
            transform: translateY(-2px);
        }

        .kit-pill.active {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(244, 114, 182, 0.4);
            background: rgba(244, 114, 182, 0.15);
            color: #ffffff;
        }

        .kit-pill img { width: 22px; height: 22px; object-fit: contain; }

        .leaderboard {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            border-radius: 10px;
            padding: 10px 18px;
            display: grid;
            grid-template-columns: 190px 1fr 65px 2fr auto;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease;
            opacity: 0;
            animation: cardPopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardPopIn {
            0% { opacity: 0; transform: translateY(25px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .player-card:hover { transform: translateY(-3px) scale(1.01); }

        .player-card.rank-card-1 {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: 1px solid #fbbf24;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
        }

        .player-card.rank-card-2 {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            border: 1px solid #94a3b8;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(100, 116, 139, 0.25);
        }

        .player-card.rank-card-3 {
            background: linear-gradient(135deg, #c2410c 0%, #9a3412 100%);
            border: 1px solid #ea580c;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(194, 65, 12, 0.25);
        }

        .player-card.rank-card-default {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            color: #ffffff;
        }

        .player-card.glint-effect::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                rgba(255, 255, 255, 0) 20%,
                rgba(255, 255, 255, 0.25) 50%,
                rgba(255, 255, 255, 0) 80%
            );
            transform: rotate(25deg);
            animation: glintSweep 3.5s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes glintSweep {
            0% { left: -150%; }
            40% { left: 150%; }
            100% { left: 150%; }
        }

        @media (max-width: 768px) {
            .player-card {
                grid-template-columns: 180px 1fr auto;
                grid-template-areas: 
                    "rank-badge info region"
                    "badges badges actions";
                gap: 10px;
            }
            .mctiers-badge-wrapper { grid-area: rank-badge; }
            .player-info { grid-area: info; }
            .region-badge { grid-area: region; }
            .tier-badges { grid-area: badges; }
            .actions { grid-area: actions; }
        }

        .mctiers-badge-wrapper {
            display: flex;
            align-items: center;
            height: 60px;
            width: 180px;
            background: rgba(0, 0, 0, 0.25);
            transform: skewX(-20deg);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .rank-number-box {
            width: 75px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            flex-shrink: 0;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .rank-number-box span { transform: skewX(20deg); }

        .skin-holder {
            width: 105px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .skin-unskew {
            transform: skewX(20deg);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .head-avatar-img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            image-rendering: pixelated;
            border-radius: 4px;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        .player-info h3 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
        }

        .player-info p {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 2px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .region-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.45);
        }

        .region-badge.region-na {
            border: 1.5px solid #ef4444;
            color: #fca5a5;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.3);
        }

        .region-badge.region-custom {
            border: 1.5px solid #22c55e;
            color: #86efac;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.3);
        }

        .tier-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            background: rgba(15, 23, 42, 0.65);
            border: 1.5px solid var(--tier-color, #38bdf8);
            box-shadow: 0 0 8px var(--tier-color, rgba(56, 189, 248, 0.25));
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--tier-color, #38bdf8);
        }

        .badge.highlight-tier {
            border-width: 2px;
            box-shadow: 0 0 12px var(--tier-color, rgba(244, 114, 182, 0.6));
        }

        .badge img { width: 16px; height: 16px; object-fit: contain; }

        .badge.tier-HT1 { --tier-color: #ef4444; }
        .badge.tier-HT2 { --tier-color: #f97316; }
        .badge.tier-HT3 { --tier-color: #f59e0b; }
        .badge.tier-HT4 { --tier-color: #eab308; }
        .badge.tier-HT5 { --tier-color: #facc15; }
        .badge.tier-LT1 { --tier-color: #a3e635; }
        .badge.tier-LT2 { --tier-color: #84cc16; }
        .badge.tier-LT3 { --tier-color: #22c55e; }
        .badge.tier-LT4 { --tier-color: #10b981; }
        .badge.tier-LT5 { --tier-color: #00ff66; }

        .actions { display: flex; gap: 6px; }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            color: white;
        }

        .btn-edit { background: #3b82f6; }
        .btn-delete { background: #ef4444; }
        .loading-text { text-align: center; color: var(--text-muted); margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BRUTE<span>TIERS</span></div>
        <div class="header-btns">
            <a href="https://discord.gg/BAjzj8qmmk" target="_blank" class="btn btn-discord">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                Discord
            </a>
            <button class="btn" id="adminToggleBtn" onclick="toggleAdmin()">⚙ Admin Login</button>
            <button class="btn btn-logout" id="logoutBtn" onclick="logoutAdmin()">Logout Admin</button>
        </div>
    </header>

    <div class="kit-bar" id="kitBar"></div>

    <div class="admin-panel" id="adminPanel">
        <h2>Admin Management Panel</h2>
        
        <form id="playerForm">
            <h3 class="form-section-title">Add / Edit Player</h3>
            <input type="hidden" id="editIndex">
            
            <div class="form-grid">
                <div>
                    <label>Minecraft Username</label>
                    <input type="text" id="username" placeholder="e.g. AxtherBhaii" required>
                </div>
                <div>
                    <label>Custom Title (Optional)</label>
                    <input type="text" id="customTitle" placeholder="e.g. Combat GrandExpert, Godlike">
                </div>
                <div>
                    <label>Region (Type NA, IND, EU etc.)</label>
                    <input type="text" id="region" list="regionList" placeholder="e.g. NA, IND, EU, ASIA">
                    <datalist id="regionList">
                        <option value="NA">
                        <option value="IND">
                        <option value="EU">
                        <option value="ASIA">
                    </datalist>
                </div>
                <div class="file-upload-wrapper">
                    <label>Player Custom Skin PNG (File Upload)</label>
                    <input type="file" id="skinFileInput" accept="image/*" onchange="handleSkinUpload(event)">
                    <input type="hidden" id="customSkinBase64">
                </div>
            </div>

            <h3 class="form-section-title">Kit Tiers</h3>
            <div class="tier-inputs" id="tierInputsContainer"></div>

            <button type="submit" class="btn" id="saveBtn" style="width: 100%; margin-top: 10px;">Save Player to Database</button>
        </form>

        <h3 class="form-section-title" style="margin-top: 25px;">Kit Representative Icons Settings</h3>
        <div class="representatives-grid" id="representativesManager"></div>
    </div>

    <div class="leaderboard" id="leaderboard">
        <div class="loading-text">Loading Leaderboard...</div>
    </div>

    <script>
        const JSONBIN_ID = "6a9753d8da38895dfe2cfae0";
        const MASTER_KEY = "$2a$10$P5QFYrh6juAzCoDI5nhou.k.YPAyiRePx/by0iRbjM3aEW5IfTxCq";

        const ALL_CATEGORIES = ['Overall', 'Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        const KITS = ['Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        const TIERS = ['NA', 'HT1', 'HT2', 'HT3', 'HT4', 'HT5', 'LT1', 'LT2', 'LT3', 'LT4', 'LT5'];
        const ADMIN_PASS = "98909890";
        let isAdminLoggedIn = false;
        let selectedCategory = 'Overall';

        const TIER_ORDER = {
            'HT1': 1, 'HT2': 2, 'HT3': 3, 'HT4': 4, 'HT5': 5,
            'LT1': 6, 'LT2': 7, 'LT3': 8, 'LT4': 9, 'LT5': 10,
            'NA': 99
        };

        const TIER_SCORES = {
            'HT1': 125, 'HT2': 112, 'HT3': 100, 'HT4': 88, 'HT5': 75,
            'LT1': 62,  'LT2': 50,  'LT3': 38,  'LT4': 25, 'LT5': 12,
            'NA': 0
        };

        let appData = { kitIcons: {}, playersList: [] };

        function loadFromLocalStorage() {
            try {
                const local = localStorage.getItem('brute_tiers_data');
                if (local) {
                    const parsed = JSON.parse(local);
                    appData.playersList = parsed.playersList || [];
                    appData.kitIcons = parsed.kitIcons || {};
                }
            } catch(e) { console.error("Local storage error", e); }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('brute_tiers_data', JSON.stringify(appData));
            } catch(e) { console.error("Local storage error", e); }
        }

        async function fetchGlobalData() {
            loadFromLocalStorage();
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
                    method: 'GET',
                    headers: { 'X-Master-Key': MASTER_KEY }
                });

                if (res.ok) {
                    const responseData = await res.json();
                    let record = responseData.record;
                    if (record) {
                        let remotePlayers = Array.isArray(record.playersList) ? record.playersList : (Array.isArray(record) ? record : []);
                        
                        const playerMap = new Map();
                        remotePlayers.forEach(p => { if (p && p.username) playerMap.set(p.username.toLowerCase(), p); });
                        appData.playersList.forEach(p => { if (p && p.username) playerMap.set(p.username.toLowerCase(), p); });
                        
                        appData.playersList = Array.from(playerMap.values());
                        appData.kitIcons = record.kitIcons || appData.kitIcons || {};
                        saveToLocalStorage();
                    }
                }
            } catch (err) {
                console.warn("Using offline/cached data.");
            } finally {
                renderKitBar();
                renderKitRepsManager();
                renderLeaderboard();
            }
        }

        async function saveGlobalData() {
            saveToLocalStorage();
            renderLeaderboard();

            const saveBtn = document.getElementById('saveBtn');
            if (saveBtn) saveBtn.textContent = "Syncing...";

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(appData)
                });
                if (!res.ok) throw new Error("Sync Fail");
            } catch (err) {
                console.warn("Saved locally due to sync issue.");
            } finally {
                if (saveBtn) saveBtn.textContent = "Save Player to Database";
            }
        }

        function toggleAdmin() {
            if (isAdminLoggedIn) {
                document.getElementById('adminPanel').classList.toggle('active');
            } else {
                const pass = prompt("Enter Admin Password:");
                if (pass === ADMIN_PASS) {
                    isAdminLoggedIn = true;
                    document.getElementById('adminPanel').classList.add('active');
                    document.getElementById('adminToggleBtn').textContent = "⚙ Panel";
                    document.getElementById('logoutBtn').style.display = "inline-block";
                    renderLeaderboard();
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminToggleBtn').textContent = "⚙ Admin Login";
            document.getElementById('logoutBtn').style.display = "none";
            renderLeaderboard();
        }

        function handleSkinUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = 32;
                        canvas.height = 32;
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = false;

                        if (img.width >= 64 && img.height >= 32) {
                            ctx.drawImage(img, 8, 8, 8, 8, 0, 0, 32, 32);
                            ctx.drawImage(img, 40, 8, 8, 8, 0, 0, 32, 32);
                            document.getElementById('customSkinBase64').value = canvas.toDataURL('image/png');
                        } else {
                            document.getElementById('customSkinBase64').value = e.target.result;
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleKitIconUpload(category, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = async function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = 32; canvas.height = 32;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, 32, 32);
                        ctx.drawImage(img, 0, 0, 32, 32);
                        
                        appData.kitIcons[category] = canvas.toDataURL('image/png', 0.5);
                        
                        renderKitBar();
                        renderKitRepsManager();
                        renderLeaderboard();
                        await saveGlobalData();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function updateKitIconUrl(category, url) {
            if(url.trim() !== "") {
                appData.kitIcons[category] = url.trim();
                renderKitBar();
                renderKitRepsManager();
                renderLeaderboard();
                await saveGlobalData();
            }
        }

        function selectCategory(category) {
            selectedCategory = category;
            renderKitBar();
            renderLeaderboard();
        }

        function buildTierInputs() {
            document.getElementById('tierInputsContainer').innerHTML = KITS.map(kit => `
                <div class="tier-input-group">
                    <label>${kit}</label>
                    <select id="tier-${kit}">
                        ${TIERS.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                </div>
            `).join('');
        }

        function renderKitBar() {
            document.getElementById('kitBar').innerHTML = ALL_CATEGORIES.map(cat => `
                <div class="kit-pill ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
                    ${appData.kitIcons[cat] ? `<img src="${appData.kitIcons[cat]}" alt="${cat}">` : ''}
                    <span>${cat}</span>
                </div>
            `).join('');
        }

        function renderKitRepsManager() {
            document.getElementById('representativesManager').innerHTML = ALL_CATEGORIES.map(cat => `
                <div class="rep-card-input">
                    <img src="${appData.kitIcons[cat] || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'36\' height=\'36\' fill=\'%231f202c\'/></svg>'}" class="rep-icon-preview">
                    <div class="rep-inputs-col">
                        <label style="font-size:0.8rem; font-weight:bold;">${cat} Icon</label>
                        <input type="file" accept="image/*" onchange="handleKitIconUpload('${cat}', event)">
                        <input type="text" placeholder="Or Direct Image URL" value="${appData.kitIcons[cat] && !appData.kitIcons[cat].startsWith('data:') ? appData.kitIcons[cat] : ''}" onchange="updateKitIconUrl('${cat}', this.value)">
                    </div>
                </div>
            `).join('');
        }

        function calculatePoints(playerTiers) {
            let total = 0;
            if (!playerTiers) return 0;
            KITS.forEach(kit => { total += TIER_SCORES[playerTiers[kit] || 'NA'] || 0; });
            return total;
        }

        function getDefaultTitle(points) {
            if (points >= 500) return 'Combat GrandExpert';
            if (points >= 300) return 'Combat Expert';
            if (points >= 100) return 'Combat Specialist';
            return 'Rookie';
        }

        function renderLeaderboard() {
            if (!appData.playersList) appData.playersList = [];

            let displayList = [...appData.playersList];

            if (selectedCategory === 'Overall') {
                displayList.sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));
            } else {
                displayList = displayList.filter(p => p.tiers && p.tiers[selectedCategory] && p.tiers[selectedCategory] !== 'NA');
                displayList.sort((a, b) => {
                    const orderA = TIER_ORDER[a.tiers[selectedCategory]] || 99;
                    const orderB = TIER_ORDER[b.tiers[selectedCategory]] || 99;
                    return orderA - orderB;
                });
            }

            const container = document.getElementById('leaderboard');
            if (displayList.length === 0) {
                container.innerHTML = `<div class="loading-text">No players found for category "${selectedCategory}".</div>`;
                return;
            }

            container.innerHTML = displayList.map((player, index) => {
                const originalIndex = appData.playersList.indexOf(player);
                const points = calculatePoints(player.tiers);
                const title = (player.customTitle && player.customTitle.trim() !== '') ? player.customTitle : getDefaultTitle(points);
                
                const displayRank = index + 1;
                const rankCardClass = displayRank === 1 ? 'rank-card-1 glint-effect' : displayRank === 2 ? 'rank-card-2 glint-effect' : displayRank === 3 ? 'rank-card-3 glint-effect' : 'rank-card-default';
                const animDelay = (index * 0.05).toFixed(2);

                const regionStr = (player.region || 'NA').trim().toUpperCase();
                const regionClass = regionStr === 'NA' ? 'region-na' : 'region-custom';

                const currentKitTier = selectedCategory !== 'Overall' ? (player.tiers ? player.tiers[selectedCategory] : null) : null;

                return `
                    <div class="player-card ${rankCardClass}" style="animation-delay: ${animDelay}s;">
                        <div class="mctiers-badge-wrapper">
                            <div class="rank-number-box">
                                <span>${displayRank}.</span>
                            </div>
                            <div class="skin-holder">
                                <div class="skin-unskew" id="skin-box-${index}"></div>
                            </div>
                        </div>
                        <div class="player-info">
                            <h3>${player.username}</h3>
                            <p>✦ ${currentKitTier ? `${selectedCategory}: ${currentKitTier}` : `${title} (${points} Points)`}</p>
                        </div>
                        <div class="region-badge ${regionClass}">${regionStr}</div>
                        <div class="tier-badges">
                            ${KITS.map(kit => {
                                const tier = player.tiers ? player.tiers[kit] : 'NA';
                                const icon = appData.kitIcons[kit];
                                const isHighlighted = kit === selectedCategory;
                                return tier && tier !== 'NA' ? `
                                    <span class="badge tier-${tier} ${isHighlighted ? 'highlight-tier' : ''}">
                                        ${icon ? `<img src="${icon}">` : `<span>${kit}:</span>`}
                                        ${tier}
                                    </span>` : '';
                            }).join('')}
                        </div>
                        ${isAdminLoggedIn ? `
                        <div class="actions">
                            <button class="btn-sm btn-edit" onclick="editPlayer(${originalIndex})">Edit</button>
                            <button class="btn-sm btn-delete" onclick="deletePlayer(${originalIndex})">X</button>
                        </div>` : ''}
                    </div>
                `;
            }).join('');

            displayList.forEach((player, index) => renderSkinHead(index, player.username, player.customSkin));
        }

        function renderSkinHead(index, username, customSkin) {
            const container = document.getElementById(`skin-box-${index}`);
            if (!container) return;

            const img = document.createElement('img');
            img.className = 'head-avatar-img';

            if (customSkin && customSkin.trim() !== '') {
                img.src = customSkin;
            } else {
                img.src = `https://mc-heads.net/avatar/${username}/100`;
                img.onerror = () => { img.src = 'https://mc-heads.net/avatar/Steve/100'; };
            }

            container.innerHTML = '';
            container.appendChild(img);
        }

        document.getElementById('playerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const editIndexVal = document.getElementById('editIndex').value;
            const editIndex = editIndexVal !== "" ? parseInt(editIndexVal) : null;
            
            const username = document.getElementById('username').value.trim();
            const customTitle = document.getElementById('customTitle').value.trim();
            const region = document.getElementById('region').value.trim() || 'NA';
            const customSkin = document.getElementById('customSkinBase64').value;

            const tiers = {};
            KITS.forEach(kit => { tiers[kit] = document.getElementById(`tier-${kit}`).value; });

            const playerData = { username, customTitle, region, customSkin, tiers };

            if (editIndex !== null && editIndex >= 0) {
                appData.playersList[editIndex] = playerData;
            } else {
                appData.playersList.push(playerData);
            }

            document.getElementById('playerForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('customSkinBase64').value = '';

            await saveGlobalData();
            if (document.getElementById('adminPanel').classList.contains('active')) {
                toggleAdmin();
            }
        });

        function editPlayer(index) {
            if (!isAdminLoggedIn) return;
            const player = appData.playersList[index];
            if (!player) return;

            document.getElementById('editIndex').value = index;
            document.getElementById('username').value = player.username;
            document.getElementById('customTitle').value = player.customTitle || '';
            document.getElementById('region').value = player.region || 'NA';
            document.getElementById('customSkinBase64').value = player.customSkin || '';

            KITS.forEach(kit => {
                document.getElementById(`tier-${kit}`).value = (player.tiers && player.tiers[kit]) ? player.tiers[kit] : 'NA';
            });

            if (!document.getElementById('adminPanel').classList.contains('active')) {
                document.getElementById('adminPanel').classList.add('active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletePlayer(index) {
            if (!isAdminLoggedIn) return;
            if (confirm('Delete this player globally from database?')) {
                appData.playersList.splice(index, 1);
                await saveGlobalData();
            }
        }

        buildTierInputs();
        fetchGlobalData();
    </script>
</body>
</html>
