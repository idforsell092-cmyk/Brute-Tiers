<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCTiers Leaderboard</title>
  <script src="https://unpkg.com/skinview3d@3.0.0/bundles/skinview3d.bundle.js"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --card-bg: #131722;
      --accent: #55ff55;
      --text: #efeff1;
      --subtext: #8e8e9e;
      --border: #1e2433;
      --danger: #ff4545;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); margin-bottom: 15px; }
    h1 { margin: 0; font-size: 22px; font-weight: 800; }
    h1 span { color: var(--accent); }
    
    .admin-toggle-btn { background: #1f2330; border: 1px solid var(--border); color: var(--subtext); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

    /* Gamemode Bar */
    .gm-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .gm-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--subtext); padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .gm-btn img { width: 18px; height: 18px; object-fit: contain; }

    /* Leaderboard Table Structure */
    .table-header { display: grid; grid-template-columns: 160px 1fr 60px 1.2fr; font-size: 11px; color: var(--subtext); font-weight: bold; text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .lb-container { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .player-row { display: grid; grid-template-columns: 160px 1fr 60px 1.2fr; align-items: center; background: var(--card-bg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; position: relative; }
    
    /* Rank Container */
    .rank-container {
      position: relative;
      width: 140px;
      height: 48px;
      display: flex;
      align-items: center;
    }

    /* Slanted Badge Background */
    .badge-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 110px;
      height: 100%;
      background: linear-gradient(135deg, #2a3245 0%, #171c28 100%);
      clip-path: polygon(0 0, 100% 0, 75% 100%, 0 100%);
      border-radius: 4px 0 0 4px;
    }
    
    .badge-bg.rank-1 { background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%); }
    .badge-bg.rank-2 { background: linear-gradient(135deg, #cbd5e1 0%, #64748b 100%); }
    .badge-bg.rank-3 { background: linear-gradient(135deg, #f97316 0%, #9a3412 100%); }

    .rank-num {
      position: relative;
      z-index: 2;
      font-weight: 900;
      font-style: italic;
      font-size: 22px;
      padding-left: 14px;
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    }
    .rank-1 .rank-num, .rank-2 .rank-num { color: #000; text-shadow: none; }

    /* 3D Player Skin */
    .p-skin {
      position: absolute;
      right: 12px;
      bottom: -2px;
      height: 56px;
      width: auto;
      object-fit: contain;
      image-rendering: pixelated;
      z-index: 3;
      filter: drop-shadow(-2px 2px 3px rgba(0,0,0,0.5));
    }

    .p-info { display: flex; flex-direction: column; justify-content: center; padding-left: 10px; }
    .p-name { font-weight: bold; font-size: 15px; color: #fff; }
    .p-sub { font-size: 11px; color: var(--subtext); display: flex; align-items: center; gap: 4px; }

    .region-tag { background: #281d1d; color: #ff5555; border: 1px solid #4a2828; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-align: center; width: max-content; }
    .region-tag.EU { background: #1d281e; color: #55ff55; border-color: #284a2b; }
    .region-tag.ME { background: #28261d; color: #ffaa00; border-color: #4a4228; }

    .tiers-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tier-badge { background: #0f121a; border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: bold; }
    .tier-badge img { width: 14px; height: 14px; object-fit: contain; }
    .tier-val { color: #ffaa00; }

    /* Admin Controls */
    .action-btns { display: none; gap: 4px; position: absolute; right: 8px; top: 8px; }
    .admin-active .action-btns { display: flex; }
    .btn-act { background: #222; border: 1px solid #444; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    .btn-del { color: var(--danger); border-color: var(--danger); }

    .admin-panel { background: var(--card-bg); border: 1px solid #333; padding: 15px; border-radius: 8px; display: none; flex-direction: column; gap: 12px; margin-bottom: 15px; }
    .admin-panel.active { display: flex; }
    .admin-panel h3 { margin: 0; color: var(--accent); font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: var(--subtext); }
    .form-group input, .form-group select { background: #0b0c10; border: 1px solid var(--border); color: #fff; padding: 7px; border-radius: 4px; font-size: 12px; }
    .btn-main { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }

    .drop-zone { border: 2px dashed var(--border); border-radius: 6px; padding: 10px; text-align: center; font-size: 11px; color: var(--subtext); cursor: pointer; background: #0b0c10; transition: border 0.2s; }
    .drop-zone:hover { border-color: var(--accent); }
    .file-input { display: none; }
  </style>
</head>
<body>

  <header>
    <h1 id="siteTitle">BRUTE <span>TIERS</span></h1>
    <button class="admin-toggle-btn" onclick="toggleAdminPanel()">⚙️ Admin Panel</button>
  </header>

  <div id="renderCanvasContainer" style="position: absolute; left: -9999px; top: -9999px;">
    <canvas id="skinCanvas" width="150" height="200"></canvas>
  </div>

  <div class="admin-panel" id="adminPanel">
    <h3>⚙️ Admin Control Center</h3>
    
    <div class="form-group">
      <label>Server/Website Name</label>
      <div style="display:flex; gap: 6px;">
        <input type="text" id="titleInput" placeholder="BRUTE TIERS" style="flex:1;">
        <button class="btn-main" onclick="saveTitle()">Save Title</button>
      </div>
    </div>

    <div style="border-top:1px solid var(--border); padding-top:10px;" class="form-group">
      <label style="font-size:12px; font-weight:bold; color:var(--accent);">Gamemode Manager</label>
      <input type="text" id="newGmName" placeholder="Gamemode Name (e.g. Pot)">
      <input type="text" id="newGmIcon" placeholder="Icon Image URL (or upload image below)">
      
      <div class="drop-zone" onclick="document.getElementById('gmFileInput').click()">
        📁 Tap to Select/Upload Gamemode Image
      </div>
      <input type="file" id="gmFileInput" class="file-input" accept="image/*" onchange="handleFileUpload(event)">

      <button class="btn-main" onclick="addGamemode()" style="margin-top:4px;">Add GM</button>
      <div id="gmRemoveList" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;"></div>
    </div>

    <div style="border-top:1px solid var(--border); padding-top:10px;" class="form-group">
      <label style="font-size:12px; font-weight:bold; color:var(--accent);" id="formModeTitle">Add / Edit Player</label>
      <input type="hidden" id="editingPlayerId">
      <input type="hidden" id="renderedSkinData">
      
      <div style="display:flex; gap:6px;">
        <input type="number" id="pRank" placeholder="Rank # (e.g. 1, 36)" style="width: 110px;" min="1">
        <input type="text" id="pName" placeholder="Minecraft Username" style="flex:1;">
      </div>

      <div style="display:flex; gap:6px;">
        <input type="text" id="pRegion" placeholder="Region (NA, EU, ME)" style="flex:1;">
        <input type="text" id="pSub" placeholder="Title (e.g. Combat Master)" style="flex:1;">
      </div>

      <div class="drop-zone" onclick="document.getElementById('skinFileInput').click()">
        👕 Tap to Upload Custom Skin File (.png)
      </div>
      <input type="file" id="skinFileInput" class="file-input" accept="image/png" onchange="processCustomSkinFile(event)">
      <div id="skinUploadStatus" style="font-size: 11px; color: var(--accent); display: none;">✓ Converting skin into 3D Model...</div>

      <div style="display:flex; gap:6px; margin-top: 4px;">
        <select id="pGmSelect" style="flex:1;"></select>
        <input type="text" id="pTierVal" placeholder="Tier Text (e.g. HT1, LT2)" style="flex:1;">
      </div>

      <button class="btn-main" onclick="savePlayer()" style="margin-top:6px;">Save Player to Leaderboard</button>
    </div>
  </div>

  <div class="gm-bar" id="gmBar"></div>

  <div class="table-header">
    <div>RANK</div>
    <div>PLAYER</div>
    <div>REGION</div>
    <div>TIERS</div>
  </div>

  <div class="lb-container" id="lbContainer"></div>

  <script>
    const ADMIN_PASS = "98909890";

    const defaultGamemodes = [
      { id: 'sword', name: 'Sword', icon: 'https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png' },
      { id: 'vanilla', name: 'Vanilla', icon: 'https://minecraft.wiki/images/Netherite_Crystal_JE2.png' },
      { id: 'pot', name: 'Pot', icon: 'https://minecraft.wiki/images/Splashing_Healing_Potion_JE2_BE2.png' }
    ];

    const defaultPlayers = [
      { id: '1', name: 'ItsNotWh1te', customSkin3D: '', region: 'AS', sub: 'Combat Grandmaster', tiers: { sword: 'HT3' } },
      { id: '2', name: 'Marlowww', customSkin3D: '', region: 'NA', sub: 'Combat Grandmaster', tiers: { sword: 'HT1', pot: 'LT1' } },
      { id: '3', name: 'ItzRealMe', customSkin3D: '', region: 'EU', sub: 'Combat Master', tiers: { sword: 'HT3', vanilla: 'LT2' } },
      { id: '4', name: 'coldified', customSkin3D: '', region: 'ME', sub: 'Combat Master', tiers: { sword: 'HT2' } }
    ];

    let gamemodes = JSON.parse(localStorage.getItem('mct_gms')) || defaultGamemodes;
    let players = JSON.parse(localStorage.getItem('mct_players')) || defaultPlayers;
    let isAdmin = false;

    const savedTitle = localStorage.getItem('mct_title');
    if (savedTitle) document.getElementById('siteTitle').innerHTML = savedTitle;

    function renderAll() {
      renderGamemodes();
      renderLeaderboard();
    }

    function renderGamemodes() {
      const bar = document.getElementById('gmBar');
      const select = document.getElementById('pGmSelect');
      const rmList = document.getElementById('gmRemoveList');

      bar.innerHTML = '';
      select.innerHTML = '';
      rmList.innerHTML = '';

      gamemodes.forEach(gm => {
        bar.innerHTML += `<div class="gm-btn"><img src="${gm.icon}" onerror="this.style.display='none'"> ${gm.name}</div>`;
        select.innerHTML += `<option value="${gm.id}">${gm.name}</option>`;
        rmList.innerHTML += `<button class="btn-act btn-del" onclick="removeGamemode('${gm.id}')">✕ ${gm.name}</button>`;
      });
    }

    function get3DSkinUrl(username) {
      return `https://mc-heads.net/body/${username}/100`;
    }

    function handleSkinError(img, username) {
      if (!img.dataset.fallback) {
        img.dataset.fallback = "true";
        img.src = `https://crafatar.com/renders/body/8667ba71-b82d-4077-9299-52fc30896072?scale=4&overlay=true`;
      }
    }

    // Process custom uploaded skin file & convert to 3D Snapshot
    function processCustomSkinFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('skinUploadStatus');
      status.style.display = 'block';
      status.innerText = "⏳ Converting Skin to 3D Model...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        
        // Render skin in 3D using skinview3d
        const canvas = document.getElementById('skinCanvas');
        const skinViewer = new skinview3d.SkinViewer({
          canvas: canvas,
          width: 150,
          height: 200,
          skin: dataUrl
        });

        // Match exact camera angle & pose of other players
        skinViewer.fov = 70;
        skinViewer.zoom = 0.90;
        skinViewer.rotation.y = -0.45;
        skinViewer.rotation.x = 0.08;

        setTimeout(() => {
          skinViewer.render();
          const snapshot3D = canvas.toDataURL('image/png');
          document.getElementById('renderedSkinData').value = snapshot3D;
          status.innerText = "✓ Custom 3D Skin Generated Successfully!";
          skinViewer.dispose();
        }, 300);
      };
      reader.readAsDataURL(file);
    }

    function renderLeaderboard() {
      const container = document.getElementById('lbContainer');
      container.innerHTML = '';

      if (isAdmin) container.classList.add('admin-active');
      else container.classList.remove('admin-active');

      players.forEach((p, idx) => {
        let tiersHTML = '';
        for (const [gmId, tierVal] of Object.entries(p.tiers)) {
          const gm = gamemodes.find(g => g.id === gmId);
          if (gm) {
            tiersHTML += `
              <div class="tier-badge">
                <img src="${gm.icon}">
                <span class="tier-val">${tierVal}</span>
              </div>
            `;
          }
        }

        // Use custom generated 3D skin model or fallback to 3D API render
        const skinSrc = (p.customSkin3D && p.customSkin3D.length > 50) ? p.customSkin3D : get3DSkinUrl(p.name);
        const rankNum = idx + 1;
        const rankClass = rankNum <= 3 ? `rank-${rankNum}` : '';

        container.innerHTML += `
          <div class="player-row">
            <div class="rank-container ${rankClass}">
              <div class="badge-bg ${rankClass}"></div>
              <span class="rank-num">${rankNum}.</span>
              <img class="p-skin" src="${skinSrc}" alt="${p.name}" onerror="handleSkinError(this, '${p.name}')">
            </div>
            
            <div class="p-info">
              <div class="p-name">${p.name}</div>
              <div class="p-sub">♦ ${p.sub || 'Member'}</div>
            </div>
            
            <div>
              <span class="region-tag ${p.region}">${p.region || 'NA'}</span>
            </div>
            
            <div class="tiers-list">${tiersHTML}</div>
            
            <div class="action-btns">
              <button class="btn-act" onclick="editPlayer('${p.id}')">Edit</button>
              <button class="btn-act btn-del" onclick="deletePlayer('${p.id}')">✕</button>
            </div>
          </div>
        `;
      });
    }

    function toggleAdminPanel() {
      if (!isAdmin) {
        const pass = prompt("Enter Admin Password:");
        if (pass !== ADMIN_PASS) return alert("Incorrect Password!");
        isAdmin = true;
      } else {
        isAdmin = false;
      }
      document.getElementById('adminPanel').classList.toggle('active', isAdmin);
      renderLeaderboard();
    }

    function saveTitle() {
      const val = document.getElementById('titleInput').value.trim();
      if (!val) return;
      const parts = val.split(' ');
      let titleHTML = val;
      if (parts.length > 1) {
        const last = parts.pop();
        titleHTML = `${parts.join(' ')} <span>${last}</span>`;
      }
      document.getElementById('siteTitle').innerHTML = titleHTML;
      localStorage.setItem('mct_title', titleHTML);
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('newGmIcon').value = e.target.result;
        alert("Image uploaded successfully!");
      };
      reader.readAsDataURL(file);
    }

    function addGamemode() {
      const name = document.getElementById('newGmName').value.trim();
      const icon = document.getElementById('newGmIcon').value.trim();
      if (!name) return alert('Enter Gamemode Name!');

      const id = name.toLowerCase().replace(/\s+/g, '');
      gamemodes.push({ id, name, icon: icon || 'https://minecraft.wiki/images/Diamond_JE3_BE3.png' });
      localStorage.setItem('mct_gms', JSON.stringify(gamemodes));
      renderAll();
      document.getElementById('newGmName').value = '';
      document.getElementById('newGmIcon').value = '';
      document.getElementById('gmFileInput').value = '';
    }

    function removeGamemode(id) {
      gamemodes = gamemodes.filter(g => g.id !== id);
      localStorage.setItem('mct_gms', JSON.stringify(gamemodes));
      renderAll();
    }

    function savePlayer() {
      const editId = document.getElementById('editingPlayerId').value;
      const rankInput = document.getElementById('pRank').value.trim();
      const name = document.getElementById('pName').value.trim();
      const customSkin3D = document.getElementById('renderedSkinData').value;
      const region = document.getElementById('pRegion').value.trim().toUpperCase();
      const sub = document.getElementById('pSub').value.trim();
      const gmId = document.getElementById('pGmSelect').value;
      const tierVal = document.getElementById('pTierVal').value.trim();

      if (!name) return alert('Enter Minecraft Username!');

      let targetIndex = rankInput ? parseInt(rankInput) - 1 : players.length;
      if (targetIndex < 0) targetIndex = 0;

      let playerObj;

      if (editId) {
        const currentIndex = players.findIndex(x => x.id === editId);
        if (currentIndex !== -1) {
          playerObj = players.splice(currentIndex, 1)[0];
        }
      }

      if (!playerObj) {
        const existingIndex = players.findIndex(x => x.name.toLowerCase() === name.toLowerCase());
        if (existingIndex !== -1) {
          playerObj = players.splice(existingIndex, 1)[0];
        } else {
          playerObj = {
            id: Date.now().toString(),
            name,
            customSkin3D,
            region,
            sub,
            tiers: {}
          };
        }
      }

      playerObj.name = name;
      if (customSkin3D) playerObj.customSkin3D = customSkin3D;
      playerObj.region = region;
      playerObj.sub = sub;
      if (tierVal) playerObj.tiers[gmId] = tierVal;

      if (targetIndex >= players.length) {
        players.push(playerObj);
      } else {
        players.splice(targetIndex, 0, playerObj);
      }

      localStorage.setItem('mct_players', JSON.stringify(players));
      resetPlayerForm();
      renderLeaderboard();
    }

    function editPlayer(id) {
      const index = players.findIndex(x => x.id === id);
      if (index === -1) return;
      
      const p = players[index];
      document.getElementById('editingPlayerId').value = p.id;
      document.getElementById('pRank').value = index + 1;
      document.getElementById('pName').value = p.name;
      document.getElementById('renderedSkinData').value = p.customSkin3D || '';
      document.getElementById('pRegion').value = p.region || '';
      document.getElementById('pSub').value = p.sub || '';
      document.getElementById('formModeTitle').innerText = 'Editing Player: ' + p.name;
    }

    function deletePlayer(id) {
      players = players.filter(x => x.id !== id);
      localStorage.setItem('mct_players', JSON.stringify(players));
      renderLeaderboard();
    }

    function resetPlayerForm() {
      document.getElementById('editingPlayerId').value = '';
      document.getElementById('pRank').value = '';
      document.getElementById('pName').value = '';
      document.getElementById('renderedSkinData').value = '';
      document.getElementById('pRegion').value = '';
      document.getElem
