<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTE TIERS</title>
    <style>
        :root {
            --bg-main: #0c0e14;
            --bg-card: #151821;
            --bg-input: #1c202d;
            --accent: #a855f7;
            --accent-hover: #9333ea;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: #232736;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 15px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 20px auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-logout {
            background: #ef4444;
            display: none;
        }

        .admin-panel {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .form-section-title {
            margin: 15px 0 10px 0;
            font-size: 1.1rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .tier-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .tier-input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .kit-bar {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            justify-content: center;
        }

        .kit-pill {
            background: var(--bg-input);
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .leaderboard {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            display: grid;
            grid-template-columns: 190px 1fr 65px 2fr auto;
            align-items: center;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .player-card {
                grid-template-columns: 180px 1fr auto;
                grid-template-areas: 
                    "rank-badge info region"
                    "badges badges actions";
                gap: 10px;
            }
            .mctiers-badge-wrapper { grid-area: rank-badge; }
            .player-info { grid-area: info; }
            .region-badge { grid-area: region; }
            .tier-badges { grid-area: badges; }
            .actions { grid-area: actions; }
        }

        .mctiers-badge-wrapper {
            display: flex;
            align-items: center;
            height: 60px;
            width: 180px;
            background: #252a38;
            transform: skewX(-20deg);
            border-radius: 4px;
            overflow: hidden;
        }

        .rank-number-box {
            width: 75px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            flex-shrink: 0;
        }

        .rank-number-box span { transform: skewX(20deg); }
        .rank-number-box.rank-1 { background: #eab308; color: #000; }
        .rank-number-box.rank-2 { background: #94a3b8; color: #000; }
        .rank-number-box.rank-3 { background: #c2410c; color: #fff; }
        .rank-number-box.rank-default { background: #2e3344; color: #fff; }

        .skin-holder {
            width: 105px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skin-unskew {
            transform: skewX(20deg);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skin-img {
            height: 90px;
            width: auto;
            object-fit: contain;
            image-rendering: pixelated;
            margin-top: 15px;
        }

        .player-info h3 { font-size: 1.2rem; font-weight: 700; }
        .player-info p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

        .region-badge {
            background: var(--bg-input);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid var(--border);
        }

        .region-badge.na-region { border-color: #ef4444; color: #ef4444; }
        .region-badge.other-region { border-color: #84cc16; color: #84cc16; }

        .tier-badges { display: flex; flex-wrap: wrap; gap: 6px; }

        .badge {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge.HT1, .badge.HT2 { color: #f43f5e; border-color: #f43f5e44; }
        .badge.HT3, .badge.HT4, .badge.HT5 { color: #fb923c; border-color: #fb923c44; }
        .badge.LT1, .badge.LT2, .badge.LT3 { color: #38bdf8; border-color: #38bdf844; }
        .badge.LT4, .badge.LT5 { color: #a3e635; border-color: #a3e63544; }

        .actions { display: flex; gap: 6px; }
        .btn-sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; border: none; color: white; }
        .btn-edit { background: #3b82f6; }
        .btn-delete { background: #ef4444; }
        .loading-text { text-align: center; color: var(--text-muted); margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BRUTE<span>TIERS</span></div>
        <div>
            <button class="btn" id="adminToggleBtn" onclick="toggleAdmin()">⚙ Admin Login</button>
            <button class="btn btn-logout" id="logoutBtn" onclick="logoutAdmin()">Logout Admin</button>
        </div>
    </header>

    <div class="kit-bar" id="kitBar"></div>

    <div class="admin-panel" id="adminPanel">
        <h2>Admin Management Panel</h2>
        <form id="playerForm">
            <h3 class="form-section-title">Add / Edit Player</h3>
            <input type="hidden" id="editIndex">
            
            <div class="form-grid">
                <div>
                    <label>Minecraft Username</label>
                    <input type="text" id="username" placeholder="e.g. AxtherBhaii" required>
                </div>
                <div>
                    <label>Region</label>
                    <select id="region">
                        <option value="IND">IND</option>
                        <option value="NA">NA</option>
                        <option value="EU">EU</option>
                        <option value="ASIA">ASIA</option>
                    </select>
                </div>
            </div>

            <h3 class="form-section-title">Kit Tiers</h3>
            <div class="tier-inputs" id="tierInputsContainer"></div>

            <button type="submit" class="btn" id="saveBtn" style="width: 100%; margin-top: 10px;">Save Player to Global Tierlist</button>
        </form>
    </div>

    <div class="leaderboard" id="leaderboard">
        <div class="loading-text">Loading Global Leaderboard...</div>
    </div>

    <script>
        // YOUR API CREDENTIALS INTEGRATED
        const JSONBIN_ID = "6a9753d8da38895dfe2cfae0";
        const MASTER_KEY = "$2a$10$P5QFYrh6juAzCoDI5nhou.k.YPAyiRePx/by0iRbjM3aEW5IfTxCq";

        const KITS = ['Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        const TIERS = ['NA', 'HT1', 'HT2', 'HT3', 'HT4', 'HT5', 'LT1', 'LT2', 'LT3', 'LT4', 'LT5'];
        const ADMIN_PASS = "98909890";
        let isAdminLoggedIn = false;

        const TIER_SCORES = {
            'HT1': 125, 'HT2': 112, 'HT3': 100, 'HT4': 88, 'HT5': 75,
            'LT1': 62,  'LT2': 50,  'LT3': 38,  'LT4': 25, 'LT5': 12,
            'NA': 0
        };

        let playersList = [];

        // Fetch data from Cloud Database
        async function fetchGlobalData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                
                // Sanitizing Response Data
                let fetchedRecords = data.record;
                if (!Array.isArray(fetchedRecords)) {
                    if (fetchedRecords && typeof fetchedRecords === 'object') {
                        fetchedRecords = Object.values(fetchedRecords);
                    } else {
                        fetchedRecords = [];
                    }
                }
                
                // Filter dummy objects if any
                playersList = fetchedRecords.filter(p => p && p.username);
                renderLeaderboard();
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('leaderboard').innerHTML = `<div class="loading-text">Error syncing leaderboard data.</div>`;
            }
        }

        // Save updated list to Cloud Database
        async function saveGlobalData() {
            document.getElementById('saveBtn').textContent = "Saving...";
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(playersList)
                });
                document.getElementById('saveBtn').textContent = "Save Player to Global Tierlist";
                fetchGlobalData();
            } catch (err) {
                alert("Error saving data!");
                document.getElementById('saveBtn').textContent = "Save Player to Global Tierlist";
            }
        }

        function toggleAdmin() {
            if (isAdminLoggedIn) {
                document.getElementById('adminPanel').classList.toggle('active');
            } else {
                const pass = prompt("Enter Admin Password:");
                if (pass === ADMIN_PASS) {
                    isAdminLoggedIn = true;
                    document.getElementById('adminPanel').classList.add('active');
                    document.getElementById('adminToggleBtn').textContent = "⚙ Panel";
                    document.getElementById('logoutBtn').style.display = "inline-block";
                    renderLeaderboard();
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminToggleBtn').textContent = "⚙ Admin Login";
            document.getElementById('logoutBtn').style.display = "none";
            renderLeaderboard();
        }

        function buildTierInputs() {
            document.getElementById('tierInputsContainer').innerHTML = KITS.map(kit => `
                <div class="tier-input-group">
                    <label>${kit}</label>
                    <select id="tier-${kit}">
                        ${TIERS.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                </div>
            `).join('');

            document.getElementById('kitBar').innerHTML = KITS.map(kit => `
                <div class="kit-pill"><span>${kit}</span></div>
            `).join('');
        }

        function calculatePoints(playerTiers) {
            let total = 0;
            if (!playerTiers) return 0;
            KITS.forEach(kit => {
                total += TIER_SCORES[playerTiers[kit] || 'NA'] || 0;
            });
            return total;
        }

        function getTitle(points) {
            if (points >= 500) return 'Combat GrandExpert';
            if (points >= 300) return 'Combat Expert';
            if (points >= 100) return 'Combat Specialist';
            return 'Rookie';
        }

        function renderLeaderboard() {
            playersList.sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));

            const container = document.getElementById('leaderboard');
            if(playersList.length === 0) {
                container.innerHTML = `<div class="loading-text">No players in leaderboard. Admin can add players from Panel.</div>`;
                return;
            }

            container.innerHTML = playersList.map((player, index) => {
                const points = calculatePoints(player.tiers);
                const title = getTitle(points);
                const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : 'rank-default';
                const regionClass = player.region === 'NA' ? 'na-region' : 'other-region';

                return `
                    <div class="player-card">
                        <div class="mctiers-badge-wrapper">
                            <div class="rank-number-box ${rankClass}">
                                <span>${index + 1}.</span>
                            </div>
                            <div class="skin-holder">
                                <div class="skin-unskew">
                                    <img class="skin-img" src="https://mc-heads.net/body/${player.username}/right" onerror="this.src='https://mc-heads.net/body/Steve/right'">
                                </div>
                            </div>
                        </div>
                        <div class="player-info">
                            <h3>${player.username}</h3>
                            <p>✦ ${title} (${points} Points)</p>
                        </div>
                        <div class="region-badge ${regionClass}">${player.region || 'IND'}</div>
                        <div class="tier-badges">
                            ${KITS.map(kit => {
                                const tier = player.tiers ? player.tiers[kit] : 'NA';
                                return tier && tier !== 'NA' ? `<span class="badge ${tier}">${kit}: ${tier}</span>` : '';
                            }).join('')}
                        </div>
                        ${isAdminLoggedIn ? `
                        <div class="actions">
                            <button class="btn-sm btn-edit" onclick="editPlayer(${index})">Edit</button>
                            <button class="btn-sm btn-delete" onclick="deletePlayer(${index})">X</button>
                        </div>` : ''}
                    </div>
                `;
            }).join('');
        }

        document.getElementById('playerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const editIndex = document.getElementById('editIndex').value;
            const username = document.getElementById('username').value.trim();
            const region = document.getElementById('region').value;

            const tiers = {};
            KITS.forEach(kit => {
                tiers[kit] = document.getElementById(`tier-${kit}`).value;
            });

            const playerData = { username, region, tiers };

            if (editIndex !== "") {
                playersList[parseInt(editIndex)] = playerData;
            } else {
                playersList.push(playerData);
            }

            document.getElementById('playerForm').reset();
            document.getElementById('editIndex').value = '';
            
            await saveGlobalData();
            toggleAdmin();
        });

        function editPlayer(index) {
            if (!isAdminLoggedIn) return;
            const player = playersList[index];
            if (!player) return;

            document.getElementById('editIndex').value = index;
            document.getElementById('username').value = player.username;
            document.getElementById('region').value = player.region || 'IND';

            KITS.forEach(kit => {
                document.getElementById(`tier-${kit}`).value = (player.tiers && player.tiers[kit]) ? player.tiers[kit] : 'NA';
            });

            if (!document.getElementById('adminPanel').classList.contains('active')) {
                document.getElementById('adminPanel').classList.add('active');
            }
        }

        async function deletePlayer(index) {
            if (!isAdminLoggedIn) return;
            if (confirm('Delete this player globally?')) {
                playersList.splice(index, 1);
                await saveGlobalData();
            }
        }

        // Initialize App
        buildTierInputs();
        fetchGlobalData();
        
        // Auto-refresh leaderboard every 10 seconds to sync changes automatically across all devices
        setInterval(fetchGlobalData, 10000);
    </script>
</body>
</html>
