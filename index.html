<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>BRUTE TIERS - Festive Edition</title>

    <meta property="og:title" content="BRUTE TIERS - Festive Rankings" />
    <meta property="og:description" content="View Minecraft's best combat players in a festive Christmas edition!" />
    <meta property="og:image" content="https://brute-tiers.vercel.app/logo.png?v=2" />
    <meta property="og:url" content="https://brute-tiers.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#166534" />
    <meta name="twitter:card" content="summary_large_image" />

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-main: #0a2316;
            --bg-input: #113824;
            --accent: #22c55e;
            --discord: #5865F2;
            --text-dark: #0f172a;
            --border: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background: #06190e;
        }

        body {
            background: radial-gradient(circle at top, #144229 0%, #082113 70%, #030d07 100%);
            background-attachment: fixed;
            color: #ffffff;
            padding: 12px;
            min-height: 100vh;
            position: relative;
        }

        .snowfall-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: radial-gradient(4px 4px at 100px 50px, #fff, rgba(0,0,0,0)), 
                              radial-gradient(3px 3px at 200px 150px, #fff, rgba(0,0,0,0)), 
                              radial-gradient(4px 4px at 300px 250px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                              radial-gradient(3px 3px at 400px 350px, rgba(255,255,255,0.9), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 500px;
            opacity: 0.35;
            z-index: 1;
        }

        header, .search-filter-bar, .kit-bar, .leaderboard, .admin-panel, footer {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto 15px auto;
            position: relative;
            z-index: 2;
        }

        .christmas-title-banner {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .christmas-title-text {
            font-size: 2.8rem;
            font-weight: 900;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 20px rgba(34, 197, 94, 0.4);
            display: inline-block;
            position: relative;
        }

        .christmas-title-text::before {
            content: '🎅';
            position: absolute;
            top: -24px;
            left: -20px;
            font-size: 2.2rem;
            transform: rotate(-20deg);
        }

        .christmas-title-text::after {
            content: '🔔 🍬 🔔';
            display: block;
            font-size: 1rem;
            letter-spacing: 6px;
            margin-top: -5px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: #ffffff; letter-spacing: 1px; }
        .logo span { color: #ef4444; }

        .header-btns {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(90deg, #15803d 0%, #22c55e 100%);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
        }

        .btn-discord { 
            background: var(--discord); 
            padding-left: 28px;
        }

        .btn-discord::before {
            content: '🎅';
            position: absolute;
            left: 6px;
            top: -6px;
            font-size: 1rem;
        }

        .btn-logout { background: #ef4444; display: none; }

        .search-filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box { flex: 1 1 200px; }
        .search-box input, .region-filter select, .platform-filter select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(15, 56, 34, 0.85);
            border: 1px solid #166534;
            border-radius: 8px;
            color: white;
            backdrop-filter: blur(4px);
            font-size: 0.9rem;
        }

        .region-filter, .platform-filter { flex: 0 0 120px; }

        .admin-panel {
            background: rgba(15, 56, 34, 0.95);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 15px;
            display: none;
        }

        .admin-panel.active { display: block; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }

        input, select {
            width: 100%;
            padding: 8px;
            background: var(--bg-input);
            border: 1px solid #166534;
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .tier-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 10px; }
        .representatives-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 15px; }

        .rep-card-input {
            background: var(--bg-input);
            border: 1px solid #166534;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rep-icon-preview { width: 32px; height: 32px; border-radius: 4px; object-fit: contain; }

        .kit-bar {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 8px;
            background: rgba(15, 56, 34, 0.85);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #166534;
            -webkit-overflow-scrolling: touch;
        }

        .kit-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(6, 36, 20, 0.8);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            color: #cbd5e1;
            flex-shrink: 0;
        }

        .kit-pill.active {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.25);
            color: #ffffff;
        }

        .kit-pill img { width: 18px; height: 18px; object-fit: contain; }

        .leaderboard { 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
        }

        .player-card {
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            position: relative;
            background: linear-gradient(90deg, #ffffff 0%, #e2e8f0 100%) !important;
            border: 2px solid #22c55e !important;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5), inset 0 0 5px rgba(34, 197, 94, 0.3);
            color: var(--text-dark);
            contain: content;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .player-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 18px rgba(34, 197, 94, 0.8), inset 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .player-card.rank-card-1::after,
        .player-card.rank-card-2::after,
        .player-card.rank-card-3::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -150%;
            width: 50%;
            height: 220%;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.6) 45%,
                rgba(255, 255, 255, 0.9) 50%,
                rgba(255, 255, 255, 0.6) 55%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            animation: cardShineSweep 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 10;
        }

        @keyframes cardShineSweep {
            0% { left: -150%; }
            35% { left: 160%; }
            100% { left: 160%; }
        }

        .player-card.rank-card-1 {
            background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%) !important;
            border-color: #fef08a !important;
            box-shadow: 0 0 12px rgba(254, 240, 138, 0.6);
        }

        .player-card.rank-card-2 {
            background: linear-gradient(90deg, #e2e8f0 0%, #94a3b8 50%, #64748b 100%) !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }
        .player-card.rank-card-2 .player-info h3 { color: #ffffff !important; }
        .player-card.rank-card-2 .player-info p { color: #f1f5f9 !important; }

        .player-card.rank-card-3 {
            background: linear-gradient(90deg, #ffedd5 0%, #fb923c 50%, #f97316 100%) !important;
            border-color: #ffedd5 !important;
            box-shadow: 0 0 12px rgba(255, 237, 213, 0.6);
        }
        .player-card.rank-card-3 .player-info h3 { color: #ffffff !important; }
        .player-card.rank-card-3 .player-info p { color: #fff7ed !important; }

        .festive-rank-badge {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            position: relative;
        }

        .festive-rank-badge.rank-1::before { content: '🟡'; position: absolute; font-size: 2.2rem; z-index: 1; }
        .festive-rank-badge.rank-2::before { content: '🔔'; position: absolute; font-size: 2.2rem; z-index: 1; }
        .festive-rank-badge.rank-3::before { content: '⭐'; position: absolute; font-size: 2.2rem; z-index: 1; }
        .festive-rank-badge span { position: relative; z-index: 2; color: #000; font-size: 1rem; }

        .mctiers-badge-wrapper {
            display: flex;
            align-items: center;
            height: 54px;
            width: 150px;
            background: rgba(15, 23, 42, 0.2);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
            padding: 0 2px;
        }

        .rank-number-box {
            width: 38px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-dark);
            flex-shrink: 0;
        }

        .skin-holder {
            width: 108px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.05);
        }

        .head-avatar-img {
            width: 100%;
            height: 50px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .player-info { flex: 1 1 140px; min-width: 130px; }
        .player-info h3 { font-size: 1.1rem; font-weight: 800; color: #0f172a; }
        .player-info p { font-size: 0.82rem; color: #334155; font-weight: 700; }

        .region-badge, .platform-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 800;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #22c55e;
            color: #86efac;
            flex-shrink: 0;
        }

        .region-badge.region-na {
            border: 1px solid #ef4444 !important;
            color: #fca5a5 !important;
        }

        .platform-badge {
            border: 1px solid #3b82f6;
            color: #93c5fd;
        }

        .platform-badge.pojav {
            border: 1px solid #a855f7;
            color: #e9d5ff;
        }

        .tier-badges { display: flex; flex-wrap: wrap; gap: 4px; flex: 2 1 180px; }

        .badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--tier-color, #38bdf8);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--tier-color, #38bdf8);
        }

        .badge img { width: 14px; height: 14px; object-fit: contain; }

        .badge.tier-HT1 { --tier-color: #ef4444; }
        .badge.tier-LT1 { --tier-color: #f87171; }
        .badge.tier-HT2 { --tier-color: #f97316; }
        .badge.tier-LT2 { --tier-color: #fb923c; }
        .badge.tier-HT3 { --tier-color: #f59e0b; }
        .badge.tier-LT3 { --tier-color: #fbbf24; }
        .badge.tier-HT4 { --tier-color: #eab308; }
        .badge.tier-LT4 { --tier-color: #fde047; }
        .badge.tier-HT5 { --tier-color: #84cc16; }
        .badge.tier-LT5 { --tier-color: #22c55e; }

        .actions { display: flex; gap: 4px; margin-left: auto; }
        .btn-sm { padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; border: none; color: white; cursor: pointer; }
        .btn-edit { background: #166534; }
        .btn-delete { background: #ef4444; }

        footer {
            text-align: center;
            padding: 20px 10px;
            margin-top: 30px;
            background: rgba(15, 56, 34, 0.7);
            border-radius: 12px;
            border: 1px solid #166534;
        }

        .christmas-footer-graphic {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .christmas-footer-text {
            font-size: 1rem;
            font-weight: 800;
            color: #86efac;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: #0f3822;
            border: 1px solid #22c55e;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
            color: white;
        }

        .modal-close { position: absolute; top: 10px; right: 10px; background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .modal-avatar { width: 50px; height: 50px; border-radius: 8px; image-rendering: pixelated; object-fit: cover; }
        .modal-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .modal-stat-box { background: var(--bg-input); padding: 8px; border-radius: 6px; display: flex; justify-content: space-between; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="snowfall-bg"></div>

    <div class="christmas-title-banner">
        <div class="christmas-title-text">BRUTETIERS</div>
    </div>

    <header>
        <div class="logo">BRUTE<span>TIERS</span></div>
        <div class="header-btns">
            <a href="https://discord.gg/BAjzj8qmmk" target="_blank" class="btn btn-discord">Discord</a>
            <button class="btn" id="adminToggleBtn" onclick="toggleAdmin()">⚙ Admin</button>
            <button class="btn btn-logout" id="logoutBtn" onclick="logoutAdmin()">Logout</button>
        </div>
    </header>

    <div class="search-filter-bar">
        <div class="search-box">
            <input type="text" id="searchPlayer" placeholder="Search player..." oninput="renderLeaderboard()">
        </div>
        <div class="platform-filter">
            <select id="filterPlatform" onchange="renderLeaderboard()">
                <option value="ALL">All Platforms</option>
                <option value="PC">PC</option>
                <option value="Pojav">Pojav</option>
            </select>
        </div>
        <div class="region-filter">
            <select id="filterRegion" onchange="renderLeaderboard()">
                <option value="ALL">All Regions</option>
                <option value="IND">IND</option>
                <option value="NA">NA</option>
                <option value="EU">EU</option>
                <option value="ASIA">ASIA</option>
                <option value="PAK">PAK</option>
                <option value="NEP">NEP</option>
            </select>
        </div>
    </div>

    <div class="kit-bar" id="kitBar"></div>

    <div class="admin-panel" id="adminPanel">
        <h2>Admin Management Panel</h2>
        <form id="playerForm">
            <input type="hidden" id="editIndex">
            <div class="form-grid">
                <div><label>Username</label><input type="text" id="username" required></div>
                <div><label>Platform</label>
                    <select id="platform">
                        <option value="PC">PC</option>
                        <option value="Pojav">Pojav</option>
                    </select>
                </div>
                <div><label>Title</label><input type="text" id="customTitle"></div>
                <div><label>Region</label><input type="text" id="region"></div>
                <div><label>Skin PNG Upload</label><input type="file" id="skinFileInput" accept="image/*" onchange="handleSkinUpload(event)"><input type="hidden" id="customSkinBase64"></div>
            </div>
            <div class="tier-inputs" id="tierInputsContainer"></div>
            <button type="submit" class="btn" id="saveBtn" style="width: 100%;">Save Player</button>
        </form>
        <div class="representatives-grid" id="representativesManager" style="margin-top:15px;"></div>
    </div>

    <div class="leaderboard" id="leaderboard"></div>

    <footer>
        <div class="christmas-footer-graphic">🐺 🎄 🎁 🐴</div>
        <div class="christmas-footer-text">Merry Minecraft Christmas from Brute Tiers!</div>
    </footer>

    <div class="modal-overlay" id="statsModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-header">
                <img id="modalAvatar" class="modal-avatar" src="" alt="Avatar">
                <div>
                    <h3 id="modalUsername"></h3>
                    <p id="modalTitle"></p>
                </div>
            </div>
            <div class="modal-stats-grid" id="modalStatsGrid"></div>
        </div>
    </div>
        <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9AWX1TEymQXn20Ech-ZZVXQsRwS35kzY",
            authDomain: "brute-tiers.firebaseapp.com",
            databaseURL: "https://brute-tiers-default-rtdb.firebaseio.com",
            projectId: "brute-tiers",
            storageBucket: "brute-tiers.firebasestorage.app",
            messagingSenderId: "35511970184",
            appId: "1:35511970184:web:6f796e44d8567bdfe8f23d",
            measurementId: "G-CVENNS4GJ6"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const globalRef = db.ref("brutetiers_data");

        const ALL_CATEGORIES = ['Overall', 'Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        const KITS = ['Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        
        const TIERS = ['NA', 'HT1', 'LT1', 'HT2', 'LT2', 'HT3', 'LT3', 'HT4', 'LT4', 'HT5', 'LT5'];
        const ADMIN_PASS = "98909890";
        let isAdminLoggedIn = false;
        let selectedCategory = 'Overall';

        const TIER_ORDER = { 
            'HT1': 1, 'LT1': 2, 'HT2': 3, 'LT2': 4, 'HT3': 5, 
            'LT3': 6, 'HT4': 7, 'LT4': 8, 'HT5': 9, 'LT5': 10, 'NA': 99 
        };

        const TIER_SCORES = { 
            'HT1': 100, 'LT1': 90, 'HT2': 80, 'LT2': 70, 'HT3': 60, 
            'LT3': 50, 'HT4': 40, 'LT4': 30, 'HT5': 20, 'LT5': 10, 'NA': 0 
        };

        let appData = { kitIcons: {}, playersList: [] };

        globalRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                appData = {
                    kitIcons: data.kitIcons || {},
                    playersList: Array.isArray(data.playersList) ? data.playersList : []
                };
            }
            renderKitBar();
            renderKitRepsManager();
            renderLeaderboard();
        });

        async function saveGlobalData() {
            renderLeaderboard();
            try {
                await globalRef.set({
                    kitIcons: appData.kitIcons || {},
                    playersList: appData.playersList || []
                });
            } catch (err) {
                console.error("Firebase Sync Error:", err);
            }
        }

        function toggleAdmin() {
            if (isAdminLoggedIn) {
                document.getElementById('adminPanel').classList.toggle('active');
            } else {
                if (prompt("Admin Password:") === ADMIN_PASS) {
                    isAdminLoggedIn = true;
                    document.getElementById('adminPanel').classList.add('active');
                    document.getElementById('adminToggleBtn').textContent = "⚙ Panel";
                    document.getElementById('logoutBtn').style.display = "inline-block";
                    renderLeaderboard();
                }
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminToggleBtn').textContent = "⚙ Admin";
            document.getElementById('logoutBtn').style.display = "none";
            renderLeaderboard();
        }

        function calculatePoints(playerTiers) {
            let total = 0;
            if (!playerTiers) return 0;
            KITS.forEach(kit => { total += TIER_SCORES[playerTiers[kit] || 'NA'] || 0; });
            return total;
        }

        // Updated Default Title by Rank Position
        function getDefaultTitleByRank(displayRank) {
            if (displayRank === 1) return 'Combat GrandMaster';
            if (displayRank === 2) return 'Combat GrandExpert';
            if (displayRank === 3) return 'Combat Expert';
            if (displayRank >= 4 && displayRank <= 10) return 'Combat Specialist';
            if (displayRank >= 11 && displayRank <= 50) return 'Combat Cadet';
            if (displayRank >= 51 && displayRank <= 100) return 'Experienced';
            return 'Rookie';
        }

        function renderKitBar() {
            document.getElementById('kitBar').innerHTML = ALL_CATEGORIES.map(cat => `
                <div class="kit-pill ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
                    ${appData.kitIcons && appData.kitIcons[cat] ? `<img src="${appData.kitIcons[cat]}">` : ''}
                    <span>${cat}</span>
                </div>
            `).join('');
        }

        function selectCategory(cat) { 
            if (selectedCategory === cat) return;
            selectedCategory = cat; 
            renderKitBar(); 
            renderLeaderboard();
        }

        function renderLeaderboard() {
            if (!appData.playersList) appData.playersList = [];

            const searchQuery = document.getElementById('searchPlayer')?.value.toLowerCase().trim() || '';
            const selectedRegion = document.getElementById('filterRegion')?.value || 'ALL';
            const selectedPlatform = document.getElementById('filterPlatform')?.value || 'ALL';

            let displayList = appData.playersList.filter(p => {
                const matchesName = p.username.toLowerCase().includes(searchQuery);
                const pRegion = (p.region || 'NA').trim().toUpperCase();
                const pPlatform = (p.platform || 'PC').trim();

                const matchesRegion = (selectedRegion === 'ALL' || pRegion === selectedRegion);
                const matchesPlatform = (selectedPlatform === 'ALL' || pPlatform.toLowerCase() === selectedPlatform.toLowerCase());

                return matchesName && matchesRegion && matchesPlatform;
            });

            if (selectedCategory === 'Overall') {
                displayList.sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));
            } else {
                displayList = displayList.filter(p => p.tiers && p.tiers[selectedCategory] && p.tiers[selectedCategory] !== 'NA');
                displayList.sort((a, b) => (TIER_ORDER[a.tiers[selectedCategory]] || 99) - (TIER_ORDER[b.tiers[selectedCategory]] || 99));
            }

            const container = document.getElementById('leaderboard');
            if (displayList.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:#cbd5e1;">No players found.</div>`;
                return;
            }

            container.innerHTML = displayList.map((player, index) => {
                const originalIndex = appData.playersList.indexOf(player);
                const points = calculatePoints(player.tiers);
                const displayRank = index + 1;
                const title = player.customTitle || getDefaultTitleByRank(displayRank);
                const rankClass = displayRank <= 3 ? `rank-card-${displayRank}` : '';
                const festiveRankClass = displayRank <= 3 ? `festive-rank-badge rank-${displayRank}` : 'rank-number-box';
                
                const avatarImg = player.customSkin || `https://mc-heads.net/body/${player.username}/100`;

                const rawRegion = (player.region || '').trim().toUpperCase();
                const isNaRegion = !rawRegion || rawRegion === 'NA';
                const regionDisplay = isNaRegion ? 'NA' : rawRegion;
                const regionClass = isNaRegion ? 'region-badge region-na' : 'region-badge';

                const platformDisplay = (player.platform || 'PC').trim();
                const platformClass = platformDisplay.toLowerCase() === 'pojav' ? 'platform-badge pojav' : 'platform-badge';

                return `
                    <div class="player-card ${rankClass}" style="--card-index: ${index};" onclick="openModal(${originalIndex})">
                        <div class="mctiers-badge-wrapper">
                            <div class="${festiveRankClass}"><span>${displayRank}.</span></div>
                            <div class="skin-holder">
                                <img class="head-avatar-img" src="${avatarImg}" loading="lazy" alt="skin" onerror="this.onerror=null; this.src='https://mc-heads.net/body/Steve/100';">
                            </div>
                        </div>
                        <div class="player-info">
                            <h3>${player.username}</h3>
                            <p>${title} (${points} Points)</p>
                        </div>
                        <div class="${platformClass}">${platformDisplay}</div>
                        <div class="${regionClass}">${regionDisplay}</div>
                        <div class="tier-badges">
                            ${KITS.map(kit => {
                                const tier = player.tiers ? player.tiers[kit] : 'NA';
                                const icon = appData.kitIcons ? appData.kitIcons[kit] : null;
                                return tier && tier !== 'NA' ? `
                                    <span class="badge tier-${tier}">
                                        ${icon ? `<img src="${icon}">` : ''}${tier}
                                    </span>` : '';
                            }).join('')}
                        </div>
                        ${isAdminLoggedIn ? `
                        <div class="actions" onclick="event.stopPropagation()">
                            <button class="btn-sm btn-edit" onclick="editPlayer(${originalIndex})">Edit</button>
                            <button class="btn-sm btn-delete" onclick="deletePlayer(${originalIndex})">X</button>
                        </div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function openModal(index) {
            const player = appData.playersList[index];
            if (!player) return;

            document.getElementById('modalUsername').textContent = player.username;
            const pts = calculatePoints(player.tiers);
            const displayRank = appData.playersList.indexOf(player) + 1;
            document.getElementById('modalTitle').textContent = `${player.customTitle || getDefaultTitleByRank(displayRank)} • (${pts} Points) • [${player.platform || 'PC'}]`;
            document.getElementById('modalAvatar').src = player.customSkin || `https://mc-heads.net/body/${player.username}/100`;

            document.getElementById('modalStatsGrid').innerHTML = KITS.map(kit => `
                <div class="modal-stat-box">
                    <span>${kit}</span>
                    <span class="badge tier-${player.tiers ? player.tiers[kit] || 'NA' : 'NA'}">${player.tiers ? player.tiers[kit] || 'NA' : 'NA'}</span>
                </div>
            `).join('');

            document.getElementById('statsModal').classList.add('active');
        }

        function closeModal() { document.getElementById('statsModal').classList.remove('active'); }

        function buildTierInputs() {
            document.getElementById('tierInputsContainer').innerHTML = KITS.map(kit => `
                <div>
                    <label style="font-size:0.75rem;">${kit}</label>
                    <select id="tier-${kit}">
                        ${TIERS.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                </div>
            `).join('');
        }

        function renderKitRepsManager() {
            document.getElementById('representativesManager').innerHTML = ALL_CATEGORIES.map(cat => `
                <div class="rep-card-input">
                    <img src="${(appData.kitIcons && appData.kitIcons[cat]) || ''}" class="rep-icon-preview">
                    <div style="flex:1;">
                        <label style="font-size:0.75rem;">${cat} Icon</label>
                        <input type="file" accept="image/*" onchange="handleKitIconUpload('${cat}', event)">
                    </div>
                </div>
            `).join('');
        }

        function handleSkinUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 32;
                    canvas.height = 32;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = false;

                    if (img.width >= 32) {
                        ctx.drawImage(img, 8, 8, 8, 8, 0, 0, 32, 32);
                        ctx.drawImage(img, 40, 8, 8, 8, 0, 0, 32, 32);
                    } else {
                        ctx.drawImage(img, 0, 0, 32, 32);
                    }
                    
                    document.getElementById('customSkinBase64').value = canvas.toDataURL('image/png');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleKitIconUpload(category, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 24;
                        canvas.height = 24;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 24, 24);
                        if (!appData.kitIcons) appData.kitIcons = {};
                        appData.kitIcons[category] = canvas.toDataURL('image/png');
                        renderKitBar();
                        renderKitRepsManager();
                        renderLeaderboard();
                        await saveGlobalData();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('playerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = "Publishing Globally...";

            const editIndexVal = document.getElementById('editIndex').value;
            const editIndex = editIndexVal !== "" ? parseInt(editIndexVal) : null;
            const username = document.getElementById('username').value.trim();
            const platform = document.getElementById('platform').value;
            let customTitle = document.getElementById('customTitle').value.trim();
            const region = document.getElementById('region').value.trim() || 'NA';
            const customSkin = document.getElementById('customSkinBase64').value;

            const tiers = {};
            KITS.forEach(kit => tiers[kit] = document.getElementById(`tier-${kit}`).value);

            let existingSkin = '';
            if (editIndex !== null && appData.playersList[editIndex]) {
                existingSkin = appData.playersList[editIndex].customSkin || '';
            }

            const playerData = { 
                username, 
                platform,
                customTitle, 
                region, 
                customSkin: customSkin || existingSkin, 
                tiers 
            };

            if (!appData.playersList) appData.playersList = [];

            if (editIndex !== null && editIndex >= 0 && editIndex < appData.playersList.length) {
                appData.playersList[editIndex] = playerData;
            } else {
                const existingIdx = appData.playersList.findIndex(p => p.username.toLowerCase() === username.toLowerCase());
                if (existingIdx !== -1) {
                    appData.playersList[existingIdx] = playerData;
                } else {
                    appData.playersList.push(playerData);
                }
            }

            document.getElementById('playerForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('customSkinBase64').value = '';

            await saveGlobalData();

            saveBtn.disabled = false;
            saveBtn.textContent = "Save Player";
            toggleAdmin();
        });

        function editPlayer(index) {
            const player = appData.playersList[index];
            if (!player) return;
            document.getElementById('editIndex').value = index;
            document.getElementById('username').value = player.username;
            document.getElementById('platform').value = player.platform || 'PC';
            document.getElementById('customTitle').value = player.customTitle || '';
            document.getElementById('region').value = player.region || 'NA';
            document.getElementById('customSkinBase64').value = player.customSkin || '';

            KITS.forEach(kit => {
                document.getElementById(`tier-${kit}`).value = (player.tiers && player.tiers[kit]) ? player.tiers[kit] : 'NA';
            });

            if (!document.getElementById('adminPanel').classList.contains('active')) toggleAdmin();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletePlayer(index) {
            if (confirm('Delete player?')) {
                appData.playersList.splice(index, 1);
                await saveGlobalData();
            }
        }

        buildTierInputs();
    </script>
</body>
</html>
