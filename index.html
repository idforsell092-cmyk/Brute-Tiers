<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTE TIERS</title>
    <style>
        :root {
            --bg-main: #0c0e14;
            --bg-card: #151821;
            --bg-input: #1c202d;
            --accent: #a855f7;
            --accent-hover: #9333ea;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: #232736;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 15px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 20px auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-logout {
            background: #ef4444;
            display: none;
        }

        .admin-panel {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .form-section-title {
            margin: 15px 0 10px 0;
            font-size: 1.1rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .file-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .file-upload-wrapper input[type="file"] {
            font-size: 0.8rem;
            padding: 6px;
        }

        .tier-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .tier-input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .representatives-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .rep-card-input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rep-icon-preview {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #000;
            object-fit: contain;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .rep-inputs-col {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
        }

        .rep-inputs-col input {
            padding: 5px 8px;
            font-size: 0.75rem;
        }

        .kit-bar {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            justify-content: center;
        }

        .kit-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .kit-pill img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .leaderboard {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            display: grid;
            grid-template-columns: 190px 1fr 65px 2fr auto;
            align-items: center;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .player-card {
                grid-template-columns: 180px 1fr auto;
                grid-template-areas: 
                    "rank-badge info region"
                    "badges badges actions";
                gap: 10px;
            }
            .mctiers-badge-wrapper { grid-area: rank-badge; }
            .player-info { grid-area: info; }
            .region-badge { grid-area: region; }
            .tier-badges { grid-area: badges; }
            .actions { grid-area: actions; }
        }

        .mctiers-badge-wrapper {
            display: flex;
            align-items: center;
            height: 60px;
            width: 180px;
            background: #252a38;
            transform: skewX(-20deg);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .rank-number-box {
            width: 75px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            flex-shrink: 0;
        }

        .rank-number-box span {
            transform: skewX(20deg);
        }

        .rank-number-box.rank-1 { background: #eab308; color: #000; }
        .rank-number-box.rank-2 { background: #94a3b8; color: #000; }
        .rank-number-box.rank-3 { background: #c2410c; color: #fff; }
        .rank-number-box.rank-default { background: #2e3344; color: #fff; }

        .skin-holder {
            width: 105px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .skin-unskew {
            transform: skewX(20deg);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skin-canvas {
            width: 54px;
            height: 54px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .skin-img {
            height: 90px;
            width: auto;
            object-fit: contain;
            image-rendering: pixelated;
            margin-top: 15px;
        }

        .player-info h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .player-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .region-badge {
            background: var(--bg-input);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid var(--border);
            text-transform: uppercase;
        }

        .region-badge.na-region {
            border-color: #ef4444;
            color: #ef4444;
        }

        .region-badge.other-region {
            border-color: #84cc16;
            color: #84cc16;
        }

        .tier-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .badge.HT1, .badge.HT2 { color: #f43f5e; border-color: #f43f5e44; }
        .badge.HT3, .badge.HT4, .badge.HT5 { color: #fb923c; border-color: #fb923c44; }
        .badge.LT1, .badge.LT2, .badge.LT3 { color: #38bdf8; border-color: #38bdf844; }
        .badge.LT4, .badge.LT5 { color: #a3e635; border-color: #a3e63544; }

        .actions {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            color: white;
        }

        .btn-edit { background: #3b82f6; }
        .btn-delete { background: #ef4444; }
        .loading-text { text-align: center; color: var(--text-muted); margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BRUTE<span>TIERS</span></div>
        <div>
            <button class="btn" id="adminToggleBtn" onclick="toggleAdmin()">⚙ Admin Login</button>
            <button class="btn btn-logout" id="logoutBtn" onclick="logoutAdmin()">Logout Admin</button>
        </div>
    </header>

    <div class="kit-bar" id="kitBar"></div>

    <div class="admin-panel" id="adminPanel">
        <h2>Admin Management Panel</h2>
        
        <form id="playerForm">
            <h3 class="form-section-title">Add / Edit Player</h3>
            <input type="hidden" id="editIndex">
            
            <div class="form-grid">
                <div>
                    <label>Minecraft Username</label>
                    <input type="text" id="username" placeholder="e.g. AxtherBhaii" required>
                </div>
                <div>
                    <label>Set Custom Rank Position (e.g. 1, 32, 40)</label>
                    <input type="number" id="customRank" placeholder="Leave empty for auto-last rank" min="1">
                </div>
                <div>
                    <label>Custom Title (Optional)</label>
                    <input type="text" id="customTitle" placeholder="e.g. Combat GrandExpert, Godlike">
                </div>
                <div>
                    <label>Region (Type anything or select)</label>
                    <input type="text" id="region" list="regionList" placeholder="e.g. IND, NA, EU, ASIA">
                    <datalist id="regionList">
                        <option value="IND">
                        <option value="NA">
                        <option value="EU">
                        <option value="ASIA">
                    </datalist>
                </div>
                <div class="file-upload-wrapper">
                    <label>Player Custom Skin Image (File Upload)</label>
                    <input type="file" id="skinFileInput" accept="image/*" onchange="handleSkinUpload(event)">
                    <input type="hidden" id="customSkinBase64">
                </div>
            </div>

            <h3 class="form-section-title">Kit Tiers</h3>
            <div class="tier-inputs" id="tierInputsContainer"></div>

            <button type="submit" class="btn" id="saveBtn" style="width: 100%; margin-top: 10px;">Save Player & Reorder Leaderboard</button>
        </form>

        <h3 class="form-section-title" style="margin-top: 25px;">Kit Representative Icons Settings</h3>
        <div class="representatives-grid" id="representativesManager"></div>
    </div>

    <div class="leaderboard" id="leaderboard">
        <div class="loading-text">Loading Leaderboard...</div>
    </div>

    <script>
        const JSONBIN_ID = "6a9753d8da38895dfe2cfae0";
        const MASTER_KEY = "$2a$10$P5QFYrh6juAzCoDI5nhou.k.YPAyiRePx/by0iRbjM3aEW5IfTxCq";

        const KITS = ['Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        const TIERS = ['NA', 'HT1', 'HT2', 'HT3', 'HT4', 'HT5', 'LT1', 'LT2', 'LT3', 'LT4', 'LT5'];
        const ADMIN_PASS = "98909890";
        let isAdminLoggedIn = false;

        const TIER_SCORES = {
            'HT1': 125, 'HT2': 112, 'HT3': 100, 'HT4': 88, 'HT5': 75,
            'LT1': 62,  'LT2': 50,  'LT3': 38,  'LT4': 25, 'LT5': 12,
            'NA': 0
        };

        let appData = {
            kitIcons: {},
            playersList: []
        };

        async function fetchGlobalData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const responseData = await res.json();
                let record = responseData.record;

                if (record) {
                    if (Array.isArray(record)) {
                        appData.playersList = record.filter(p => p && p.username);
                        appData.kitIcons = appData.kitIcons || {};
                    } else if (typeof record === 'object') {
                        appData.playersList = Array.isArray(record.playersList) ? record.playersList.filter(p => p && p.username) : [];
                        appData.kitIcons = record.kitIcons || {};
                    }
                }
                
                renderKitBar();
                renderKitRepsManager();
                renderLeaderboard();
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('leaderboard').innerHTML = `<div class="loading-text">Error connecting to global database.</div>`;
            }
        }

        async function saveGlobalData() {
            const saveBtn = document.getElementById('saveBtn');
            if (saveBtn) saveBtn.textContent = "Syncing with Database...";
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(appData)
                });
                if (!response.ok) throw new Error("Sync failed");
                if (saveBtn) saveBtn.textContent = "Save Player & Reorder Leaderboard";
                fetchGlobalData();
            } catch (err) {
                alert("Error saving data to database!");
                if (saveBtn) saveBtn.textContent = "Save Player & Reorder Leaderboard";
            }
        }

        function toggleAdmin() {
            if (isAdminLoggedIn) {
                document.getElementById('adminPanel').classList.toggle('active');
            } else {
                const pass = prompt("Enter Admin Password:");
                if (pass === ADMIN_PASS) {
                    isAdminLoggedIn = true;
                    document.getElementById('adminPanel').classList.add('active');
                    document.getElementById('adminToggleBtn').textContent = "⚙ Panel";
                    document.getElementById('logoutBtn').style.display = "inline-block";
                    renderLeaderboard();
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminToggleBtn').textContent = "⚙ Admin Login";
            document.getElementById('logoutBtn').style.display = "none";
            renderLeaderboard();
        }

        function handleSkinUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('customSkinBase64').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleKitIconUpload(kit, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = async function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = 64;
                        canvas.height = 64;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, 64, 64);
                        ctx.drawImage(img, 0, 0, 64, 64);
                        
                        appData.kitIcons[kit] = canvas.toDataURL('image/png');
                        
                        renderKitBar();
                        renderKitRepsManager();
                        renderLeaderboard();
                        await saveGlobalData();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function updateKitIconUrl(kit, url) {
            if(url.trim() !== "") {
                appData.kitIcons[kit] = url.trim();
                renderKitBar();
                renderKitRepsManager();
                renderLeaderboard();
                await saveGlobalData();
            }
        }

        function buildTierInputs() {
            document.getElementById('tierInputsContainer').innerHTML = KITS.map(kit => `
                <div class="tier-input-group">
                    <label>${kit}</label>
                    <select id="tier-${kit}">
                        ${TIERS.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                </div>
            `).join('');
        }

        function renderKitBar() {
            document.getElementById('kitBar').innerHTML = KITS.map(kit => `
                <div class="kit-pill">
                    ${appData.kitIcons[kit] ? `<img src="${appData.kitIcons[kit]}" alt="${kit}">` : ''}
                    <span>${kit}</span>
                </div>
            `).join('');
        }

        function renderKitRepsManager() {
            document.getElementById('representativesManager').innerHTML = KITS.map(kit => `
                <div class="rep-card-input">
                    <img src="${appData.kitIcons[kit] || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'36\' height=\'36\' fill=\'%231f202c\'/></svg>'}" class="rep-icon-preview">
                    <div class="rep-inputs-col">
                        <label style="font-size:0.8rem; font-weight:bold;">${kit} Icon</label>
                        <input type="file" accept="image/*" onchange="handleKitIconUpload('${kit}', event)">
                        <input type="text" placeholder="Or Direct Image URL" value="${appData.kitIcons[kit] && !appData.kitIcons[kit].startsWith('data:') ? appData.kitIcons[kit] : ''}" onchange="updateKitIconUrl('${kit}', this.value)">
                    </div>
                </div>
            `).join('');
        }

        function calculatePoints(playerTiers) {
            let total = 0;
            if (!playerTiers) return 0;
            KITS.forEach(kit => {
                total += TIER_SCORES[playerTiers[kit] || 'NA'] || 0;
            });
            return total;
        }

        function getDefaultTitle(points) {
            if (points >= 500) return 'Combat GrandExpert';
            if (points >= 300) return 'Combat Expert';
            if (points >= 100) return 'Combat Specialist';
            return 'Rookie';
        }

        function reorderRanks(targetRank, editIndex = null) {
            let target = parseInt(targetRank);
            if (isNaN(target) || target < 1) return;

            appData.playersList.forEach((p, idx) => {
                if (editIndex !== null && idx === editIndex) return;
                let currentRank = parseInt(p.customRank);
                if (!isNaN(currentRank) && currentRank >= target) {
                    p.customRank = currentRank + 1;
                }
            });
        }

        function renderLeaderboard() {
            // STRICT ASCENDING ORDER SORTING (1, 2, 3 ... 100)
            appData.playersList.sort((a, b) => {
                const rankA = parseInt(a.customRank);
                const rankB = parseInt(b.customRank);

                if (!isNaN(rankA) && !isNaN(rankB)) return rankA - rankB;
                if (!isNaN(rankA)) return -1;
                if (!isNaN(rankB)) return 1;

                return calculatePoints(b.tiers) - calculatePoints(a.tiers);
            });

            const container = document.getElementById('leaderboard');
            if (appData.playersList.length === 0) {
                container.innerHTML = `<div class="loading-text">No players found. Login as Admin to add players.</div>`;
                return;
            }

            container.innerHTML = appData.playersList.map((player, index) => {
                const points = calculatePoints(player.tiers);
                const title = (player.customTitle && player.customTitle.trim() !== '') ? player.customTitle : getDefaultTitle(points);
                
                const displayRank = player.customRank ? parseInt(player.customRank) : (index + 1);
                
                const rankClass = displayRank === 1 ? 'rank-1' : displayRank === 2 ? 'rank-2' : displayRank === 3 ? 'rank-3' : 'rank-default';
                const regionClass = player.region === 'NA' ? 'na-region' : 'other-region';

                return `
                    <div class="player-card">
                        <div class="mctiers-badge-wrapper">
                            <div class="rank-number-box ${rankClass}">
                                <span>${displayRank}.</span>
                            </div>
                            <div class="skin-holder">
                                <div class="skin-unskew" id="skin-box-${index}"></div>
                            </div>
                        </div>
                        <div class="player-info">
                            <h3>${player.username}</h3>
                            <p>✦ ${title} (${points} Points)</p>
                        </div>
                        <div class="region-badge ${regionClass}">${player.region || 'IND'}</div>
                        <div class="tier-badges">
                            ${KITS.map(kit => {
                                const tier = player.tiers ? player.tiers[kit] : 'NA';
                                const icon = appData.kitIcons[kit];
                                return tier && tier !== 'NA' ? `
                                    <span class="badge ${tier}">
                                        ${icon ? `<img src="${icon}">` : `<span>${kit}:</span>`}
                                        ${tier}
                                    </span>` : '';
                            }).join('')}
                        </div>
                        ${isAdminLoggedIn ? `
                        <div class="actions">
                            <button class="btn-sm btn-edit" onclick="editPlayer(${index})">Edit</button>
                            <button class="btn-sm btn-delete" onclick="deletePlayer(${index})">X</button>
                        </div>` : ''}
                    </div>
                `;
            }).join('');

            appData.playersList.forEach((player, index) => renderSkin(index, player.username, player.customSkin));
        }

        function renderSkin(index, username, customSkin) {
            const container = document.getElementById(`skin-box-${index}`);
            if (!container) return;

            if (customSkin && customSkin.trim() !== '') {
                const canvas = document.createElement('canvas');
                canvas.width = 16;
                canvas.height = 16;
                canvas.className = 'skin-canvas';
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false;

                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, 16, 16);
                    ctx.drawImage(img, 8, 8, 8, 8, 4, 0, 8, 8);
                    ctx.drawImage(img, 40, 8, 8, 8, 4, 0, 8, 8);
                    ctx.drawImage(img, 20, 20, 8, 8, 4, 8, 8, 8);
                    ctx.drawImage(img, 44, 20, 4, 8, 0, 8, 4, 8);
                    ctx.drawImage(img, 36, 52, 4, 8, 12, 8, 4, 8);
                };
                img.src = customSkin;
                container.innerHTML = '';
                container.appendChild(canvas);
            } else {
                const img = document.createElement('img');
                img.className = 'skin-img';
                img.src = `https://mc-heads.net/body/${username}/right`;
                img.onerror = () => { img.src = 'https://mc-heads.net/body/Steve/right'; };
                container.innerHTML = '';
                container.appendChild(img);
            }
        }

        document.getElementById('playerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const editIndexVal = document.getElementById('editIndex').value;
            const editIndex = editIndexVal !== "" ? parseInt(editIndexVal) : null;
            
            const username = document.getElementById('username').value.trim();
            let customRank = document.getElementById('customRank').value.trim();
            const customTitle = document.getElementById('customTitle').value.trim();
            const region = document.getElementById('region').value.trim() || 'IND';
            const customSkin = document.getElementById('customSkinBase64').value;

            const tiers = {};
            KITS.forEach(kit => {
                tiers[kit] = document.getElementById(`tier-${kit}`).value;
            });

            if (customRank !== "") {
                reorderRanks(customRank, editIndex);
            } else {
                if (editIndex === null) {
                    customRank = appData.playersList.length + 1;
                }
            }

            const playerData = { username, customRank: customRank ? parseInt(customRank) : "", customTitle, region, customSkin, tiers };

            if (editIndex !== null) {
                appData.playersList[editIndex] = playerData;
            } else {
                appData.playersList.push(playerData);
            }

            document.getElementById('playerForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('customSkinBase64').value = '';

            await saveGlobalData();
            toggleAdmin();
        });

        function editPlayer(index) {
            if (!isAdminLoggedIn) return;
            const player = appData.playersList[index];
            if (!player) return;

            document.getElementById('editIndex').value = index;
            document.getElementById('username').value = player.username;
            document.getElementById('customRank').value = player.customRank || '';
            document.getElementById('customTitle').value = player.customTitle || '';
            document.getElementById('region').value = player.region || 'IND';
            document.getElementById('customSkinBase64').value = player.customSkin || '';

            KITS.forEach(kit => {
                document.getElementById(`tier-${kit}`).value = (player.tiers && player.tiers[kit]) ? player.tiers[kit] : 'NA';
            });

            if (!document.getElementById('adminPanel').classList.contains('active')) {
                document.getElementById('adminPanel').classList.add('active');
            }
        }

        async function deletePlayer(index) {
            if (!isAdminLoggedIn) return;
            if (confirm('Delete this player globally from database?')) {
                appData.playersList.splice(index, 1);
                await saveGlobalData();
            }
        }

        buildTierInputs();
        fetchGlobalData();
        setInterval(fetchGlobalData, 10000);
    </script>
</body>
</html>
