<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUTE TIERS</title>
    <style>
        :root {
            --bg-main: #0d0e12;
            --bg-card: #15161e;
            --bg-input: #1f202c;
            --accent: #a855f7;
            --accent-hover: #9333ea;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2e303e;
            --gold: #f59e0b;
            --silver: #9ca3af;
            --bronze: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 15px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 20px auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .admin-panel {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .form-section-title {
            margin: 15px 0 10px 0;
            font-size: 1.1rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .file-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .file-upload-wrapper input[type="file"] {
            font-size: 0.8rem;
            padding: 6px;
        }

        .tier-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .tier-input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        /* Kit Representatives Manager Grid */
        .representatives-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .rep-card-input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rep-icon-preview {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #000;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        /* Kit Icons Bar Top */
        .kit-bar {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            justify-content: center;
        }

        .kit-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .kit-pill img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        /* Leaderboard styling */
        .leaderboard {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            display: grid;
            grid-template-columns: 40px 80px 1fr 70px 2fr auto;
            align-items: center;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .player-card {
                grid-template-columns: 30px 60px 1fr auto;
                grid-template-areas: 
                    "rank skin info region"
                    "badges badges badges actions";
                gap: 10px;
            }
            .rank { grid-area: rank; }
            .full-body-skin { grid-area: skin; }
            .player-info { grid-area: info; }
            .region-badge { grid-area: region; }
            .tier-badges { grid-area: badges; }
            .actions { grid-area: actions; }
        }

        .rank {
            font-size: 1.3rem;
            font-weight: 800;
        }

        .rank-1 { color: var(--gold); }
        .rank-2 { color: var(--silver); }
        .rank-3 { color: var(--bronze); }

        .full-body-skin {
            width: 60px;
            height: 90px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .player-info h3 {
            font-size: 1.1rem;
        }

        .player-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .region-badge {
            background: var(--bg-input);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            border: 1px solid var(--border);
        }

        .tier-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge img {
            width: 14px;
            height: 14px;
            object-fit: contain;
        }

        .badge.HT1, .badge.HT2 { color: #f43f5e; border-color: #f43f5e44; }
        .badge.HT3, .badge.HT4, .badge.HT5 { color: #fb923c; border-color: #fb923c44; }
        .badge.LT1, .badge.LT2, .badge.LT3 { color: #38bdf8; border-color: #38bdf844; }
        .badge.LT4, .badge.LT5 { color: #a3e635; border-color: #a3e63544; }

        .actions {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            color: white;
        }

        .btn-edit { background: #3b82f6; }
        .btn-delete { background: #ef4444; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BRUTE<span>TIERS</span></div>
        <button class="btn" onclick="toggleAdmin()">⚙ Admin Panel</button>
    </header>

    <div class="kit-bar" id="kitBar"></div>

    <div class="admin-panel" id="adminPanel">
        <h2>Admin Management Panel</h2>
        
        <form id="playerForm">
            <h3 class="form-section-title">Add / Edit Player</h3>
            <input type="hidden" id="editIndex">
            
            <div class="form-grid">
                <div>
                    <label>Minecraft Username</label>
                    <input type="text" id="username" placeholder="e.g. AxtherBhaii" required>
                </div>
                <div>
                    <label>Region</label>
                    <select id="region">
                        <option value="IND">IND</option>
                        <option value="NA">NA</option>
                        <option value="EU">EU</option>
                        <option value="ASIA">ASIA</option>
                    </select>
                </div>
                <div class="file-upload-wrapper">
                    <label>Player Skin (Upload Image)</label>
                    <input type="file" id="skinFileInput" accept="image/*" onchange="handleSkinUpload(event)">
                    <input type="hidden" id="customSkinBase64">
                </div>
            </div>

            <h3 class="form-section-title">Kit Tiers</h3>
            <div class="tier-inputs" id="tierInputsContainer"></div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Save Player to Global Leaderboard</button>
        </form>

        <h3 class="form-section-title" style="margin-top: 25px;">Kit Representatives & Icons Settings</h3>
        <div class="representatives-grid" id="representativesManager"></div>
    </div>

    <div class="leaderboard" id="leaderboard"></div>

    <script>
        const KITS = ['Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        const TIERS = ['NA', 'HT1', 'HT2', 'HT3', 'HT4', 'HT5', 'LT1', 'LT2', 'LT3', 'LT4', 'LT5'];
        
        const TIER_SCORES = {
            'HT1': 125, 'HT2': 112, 'HT3': 100, 'HT4': 88, 'HT5': 75,
            'LT1': 62,  'LT2': 50,  'LT3': 38,  'LT4': 25, 'LT5': 12,
            'NA': 0
        };

        // Default Kit Icons
        let kitIcons = JSON.parse(localStorage.getItem('brute_kit_icons')) || {};

        // Default Global Players Data
        const defaultPlayers = [
            {
                username: "AxtherBhaii",
                region: "IND",
                customSkin: "",
                tiers: { Sword: "HT4", Axe: "HT3", NethPot: "LT1", DiaPot: "LT2", UHC: "HT4", Smp: "LT2", Lifesteal: "LT3", Mace: "NA", Crystal: "LT1" }
            },
            {
                username: "ItsNotWh1te",
                region: "IND",
                customSkin: "",
                tiers: { Sword: "LT2", Axe: "HT3", NethPot: "HT5", DiaPot: "LT3", UHC: "LT1", Smp: "LT4", Lifesteal: "LT3", Mace: "LT4", Crystal: "LT3" }
            },
            {
                username: "blatha",
                region: "IND",
                customSkin: "",
                tiers: { Sword: "HT5", Axe: "LT2", NethPot: "NA", DiaPot: "LT3", UHC: "LT3", Smp: "LT5", Lifesteal: "LT4", Mace: "NA", Crystal: "NA" }
            },
            { username: "sufrrlol", region: "NA", customSkin: "", tiers: { Sword: "LT3" } },
            { username: "RealElite_", region: "NA", customSkin: "", tiers: { Sword: "LT4" } },
            { username: "nexloft_playz", region: "NA", customSkin: "", tiers: { Sword: "LT4" } },
            { username: "RaiKOuu_", region: "NA", customSkin: "", tiers: { Sword: "LT4" } },
            { username: "EzLoad__", region: "NA", customSkin: "", tiers: { Sword: "LT4" } },
            { username: "ItzDoomsdayy", region: "NA", customSkin: "", tiers: { Sword: "LT5" } }
        ];

        let players = JSON.parse(localStorage.getItem('brute_tiers_data')) || defaultPlayers;

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('active');
        }

        // Handle Player Skin Image File Upload
        function handleSkinUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('customSkinBase64').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Handle Kit Icon File Upload
        function handleKitIconUpload(kit, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    kitIcons[kit] = e.target.result;
                    localStorage.setItem('brute_kit_icons', JSON.stringify(kitIcons));
                    renderKitBar();
                    renderKitRepsManager();
                    renderLeaderboard();
                };
                reader.readAsDataURL(file);
            }
        }

        function buildTierInputs() {
            const container = document.getElementById('tierInputsContainer');
            container.innerHTML = KITS.map(kit => `
                <div class="tier-input-group">
                    <label>${kit}</label>
                    <select id="tier-${kit}">
                        ${TIERS.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                </div>
            `).join('');
        }

        function renderKitBar() {
            const bar = document.getElementById('kitBar');
            bar.innerHTML = KITS.map(kit => `
                <div class="kit-pill">
                    ${kitIcons[kit] ? `<img src="${kitIcons[kit]}" alt="${kit}">` : ''}
                    <span>${kit}</span>
                </div>
            `).join('');
        }

        function renderKitRepsManager() {
            const container = document.getElementById('representativesManager');
            container.innerHTML = KITS.map(kit => `
                <div class="rep-card-input">
                    <img src="${kitIcons[kit] || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'36\' height=\'36\' fill=\'%231f202c\'/></svg>'}" class="rep-icon-preview">
                    <div style="flex-grow: 1;">
                        <label style="font-size:0.8rem; font-weight:bold; display:block;">${kit} Icon</label>
                        <input type="file" accept="image/*" onchange="handleKitIconUpload('${kit}', event)">
                    </div>
                </div>
            `).join('');
        }

        function calculatePoints(playerTiers) {
            let total = 0;
            KITS.forEach(kit => {
                const tier = playerTiers[kit] || 'NA';
                total += TIER_SCORES[tier] || 0;
            });
            return total;
        }

        function getTitle(points) {
            if (points >= 800) return 'Combat Grandmaster';
            if (points >= 500) return 'Combat GrandExpert';
            if (points >= 300) return 'Combat Expert';
            if (points >= 100) return 'Combat Specialist';
            return 'Rookie';
        }

        function getFullSkinUrl(username, customSkin) {
            if (customSkin && customSkin.trim() !== '') {
                return customSkin;
            }
            // Full Body Render API for Minecraft
            return `https://mc-heads.net/body/${username}/right`;
        }

        function renderLeaderboard() {
            players.sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));
            localStorage.setItem('brute_tiers_data', JSON.stringify(players));

            const container = document.getElementById('leaderboard');
            container.innerHTML = players.map((player, index) => {
                const points = calculatePoints(player.tiers);
                const title = getTitle(points);
                const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
                const skinUrl = getFullSkinUrl(player.username, player.customSkin);

                return `
                    <div class="player-card">
                        <div class="rank ${rankClass}">${index + 1}.</div>
                        <img src="${skinUrl}" class="full-body-skin" alt="${player.username}" onerror="this.src='https://mc-heads.net/body/Steve/right'">
                        <div class="player-info">
                            <h3>${player.username}</h3>
                            <p>✦ ${title} (${points} Points)</p>
                        </div>
                        <div class="region-badge">${player.region}</div>
                        <div class="tier-badges">
                            ${KITS.map(kit => {
                                const tier = player.tiers[kit];
                                const icon = kitIcons[kit];
                                return tier && tier !== 'NA' ? `
                                    <span class="badge ${tier}">
                                        ${icon ? `<img src="${icon}">` : ''}
                                        ${kit}: ${tier}
                                    </span>` : '';
                            }).join('')}
                        </div>
                        <div class="actions">
                            <button class="btn-sm btn-edit" onclick="editPlayer(${index})">Edit</button>
                            <button class="btn-sm btn-delete" onclick="deletePlayer(${index})">X</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('playerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const index = document.getElementById('editIndex').value;
            const username = document.getElementById('username').value.trim();
            const region = document.getElementById('region').value;
            const customSkin = document.getElementById('customSkinBase64').value;

            const tiers = {};
            KITS.forEach(kit => {
                tiers[kit] = document.getElementById(`tier-${kit}`).value;
            });

            const playerData = { username, region, customSkin, tiers };

            if (index !== '') {
                players[index] = playerData;
            } else {
                players.push(playerData);
            }

            document.getElementById('playerForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('customSkinBase64').value = '';
            toggleAdmin();
            renderLeaderboard();
        });

        function editPlayer(index) {
            const player = players[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('username').value = player.username;
            document.getElementById('region').value = player.region;
            document.getElementById('customSkinBase64').value = player.customSkin || '';

            KITS.forEach(kit => {
                document.getElementById(`tier-${kit}`).value = player.tiers[kit] || 'NA';
            });

            if (!document.getElementById('adminPanel').classList.contains('active')) {
                toggleAdmin();
            }
        }

        function deletePlayer(index) {
            if (confirm('Delete this player?')) {
                players.splice(index, 1);
                renderLeaderboard();
            }
        }

        buildTierInputs();
        renderKitBar();
        renderKitRepsManager();
        renderLeaderboard();
    </script>
</body>
</html>
