<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>BRUTE TIERS - Festive Edition</title>

    <meta property="og:title" content="BRUTE TIERS - Festive Rankings" />
    <meta property="og:description" content="View Minecraft's best combat players in a festive Christmas edition!" />
    <meta property="og:image" content="https://brute-tiers.vercel.app/logo.png?v=2" />
    <meta property="og:url" content="https://brute-tiers.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#166534" />
    <meta name="twitter:card" content="summary_large_image" />

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-main: #0a2316;
            --bg-input: #113824;
            --accent: #22c55e;
            --discord: #5865F2;
            --text-dark: #0f172a;
            --border: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background: #06190e;
        }

        body {
            background: radial-gradient(circle at top, #144229 0%, #082113 70%, #030d07 100%);
            background-attachment: fixed;
            color: #ffffff;
            padding: 12px;
            min-height: 100vh;
            position: relative;
        }

        .snowfall-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: radial-gradient(4px 4px at 100px 50px, #fff, rgba(0,0,0,0)), 
                              radial-gradient(3px 3px at 200px 150px, #fff, rgba(0,0,0,0)), 
                              radial-gradient(4px 4px at 300px 250px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                              radial-gradient(3px 3px at 400px 350px, rgba(255,255,255,0.9), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 500px;
            opacity: 0.35;
            z-index: 1;
        }

        header, .search-filter-bar, .podium-container, .podium-divider-strip, .kit-bar, .leaderboard, .admin-panel, footer {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto 15px auto;
            position: relative;
            z-index: 2;
        }

        .christmas-title-banner {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .christmas-title-text {
            font-size: 2.8rem;
            font-weight: 900;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 20px rgba(34, 197, 94, 0.4);
            display: inline-block;
            position: relative;
        }

        .christmas-title-text::before {
            content: '🎅';
            position: absolute;
            top: -24px; left: -20px;
            font-size: 2.2rem;
            transform: rotate(-20deg);
        }

        .christmas-title-text::after {
            content: '🔔 🍬 🔔';
            display: block;
            font-size: 1rem;
            letter-spacing: 6px;
            margin-top: -5px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: #ffffff; letter-spacing: 1px; }
        .logo span { color: #ef4444; }

        .header-btns {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(90deg, #15803d 0%, #22c55e 100%);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
        }

        .btn-discord { background: var(--discord); padding-left: 28px; }
        .btn-discord::before { content: '🎅'; position: absolute; left: 6px; top: -6px; font-size: 1rem; }
        .btn-logout { background: #ef4444; display: none; }

        .search-filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box { flex: 1 1 200px; }
        .search-box input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(15, 56, 34, 0.85);
            border: 1px solid #166534;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .custom-select-box {
            position: relative;
            background: rgba(15, 56, 34, 0.95);
            border: 1px solid #166534;
            border-radius: 8px;
            color: white;
            padding: 10px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .custom-select-box::after {
            content: '▼';
            font-size: 0.65rem;
            color: #86efac;
            margin-left: 8px;
        }

        .region-filter, .platform-filter { flex: 0 0 130px; position: relative; }

        /* Solid Opaque Background Dropdown Menus to fix transparency issue */
        .android-dropdown-menu {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .android-dropdown-menu.active { display: flex; }
        .android-dropdown-card {
            background: #06190e;
            border: 2px solid #22c55e;
            border-radius: 16px;
            width: 100%;
            max-width: 340px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.95);
            padding: 10px 0;
            display: flex;
            flex-direction: column;
        }
        .android-dropdown-title {
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #86efac;
            border-bottom: 1px solid #166534;
            margin-bottom: 5px;
        }
        .android-dropdown-option {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 1rem;
            color: #f1f5f9;
            transition: background 0.15s;
        }
        .android-dropdown-option:hover { background: rgba(34, 197, 94, 0.2); }
        .android-dropdown-option.selected { color: #86efac; font-weight: 700; }
        .android-radio-circle {
            width: 20px; height: 20px;
            border: 2px solid #86efac;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .android-dropdown-option.selected .android-radio-circle {
            border-color: #22c55e;
            background: #22c55e;
            border-width: 6px;
        }
    </style>
</head>
<head>
    <style>
        .podium-container {
            display: flex; justify-content: center; align-items: flex-end; gap: 15px; margin: 20px auto 10px auto; padding: 10px; flex-wrap: wrap;
        }
        .podium-card {
            background: rgba(15, 56, 34, 0.85); border: 2px solid #22c55e; border-radius: 16px; padding: 15px;
            display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: transform 0.2s ease; cursor: pointer;
        }
        .podium-card:hover { transform: translateY(-5px); }
        .podium-card.rank-1 { order: 2; width: 220px; background: linear-gradient(180deg, rgba(245, 158, 11, 0.25) 0%, rgba(15, 56, 34, 0.9) 100%); border-color: #fbbf24; z-index: 3; }
        .podium-card.rank-2 { order: 1; width: 190px; background: linear-gradient(180deg, rgba(148, 163, 184, 0.25) 0%, rgba(15, 56, 34, 0.9) 100%); border-color: #cbd5e1; z-index: 2; }
        .podium-card.rank-3 { order: 3; width: 190px; background: linear-gradient(180deg, rgba(249, 115, 22, 0.25) 0%, rgba(15, 56, 34, 0.9) 100%); border-color: #fb923c; z-index: 1; }
        .podium-crown { font-size: 2rem; position: absolute; top: -22px; }
        .podium-avatar-box {
            width: 80px; height: 90px; display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.3); border-radius: 10px; margin-bottom: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
        }
        .podium-avatar-box img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
        .podium-card.rank-1 .podium-avatar-box { width: 95px; height: 110px; }
        .podium-info h3 { font-size: 1rem; font-weight: 800; color: #ffffff; margin-bottom: 2px; }
        .podium-info p { font-size: 0.75rem; color: #cbd5e1; font-weight: 700; margin-bottom: 6px; }
        .podium-points { font-size: 0.8rem; font-weight: 900; color: #86efac; background: rgba(34, 197, 94, 0.2); padding: 2px 8px; border-radius: 6px; display: inline-block; }

        .podium-divider-strip {
            height: 8px; background: linear-gradient(90deg, transparent, #22c55e, #fbbf24, #22c55e, transparent);
            border-radius: 4px; margin: 10px auto 15px auto; box-shadow: 0 0 10px rgba(34, 197, 94, 0.6); opacity: 0.85;
        }

        .admin-panel { background: rgba(15, 56, 34, 0.95); border: 1px solid #22c55e; border-radius: 12px; padding: 15px; display: none; }
        .admin-panel.active { display: block; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
        input, select { width: 100%; padding: 8px; background: var(--bg-input); border: 1px solid #166534; border-radius: 6px; color: white; outline: none; }
        .tier-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 10px; }
        .representatives-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .rep-card-input { background: var(--bg-input); border: 1px solid #166534; padding: 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
        .rep-icon-preview { width: 32px; height: 32px; border-radius: 4px; object-fit: contain; }

        .kit-bar {
            display: flex; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; gap: 8px;
            background: rgba(15, 56, 34, 0.85); padding: 10px; border-radius: 10px; border: 1px solid #166534; -webkit-overflow-scrolling: touch;
        }
        .kit-pill {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(6, 36, 20, 0.8);
            padding: 6px 12px; border-radius: 6px; border: 1px solid transparent; font-size: 0.8rem; font-weight: 600; cursor: pointer; color: #cbd5e1; flex-shrink: 0;
        }
        .kit-pill.active { border-color: #22c55e; background: rgba(34, 197, 94, 0.25); color: #ffffff; }
        .kit-pill img { width: 18px; height: 18px; object-fit: contain; }

        .leaderboard { display: flex; flex-direction: column; gap: 12px; }

        .player-card {
            border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; position: relative;
            background: linear-gradient(90deg, #ffffff 0%, #e2e8f0 100%) !important; border: 2px solid #22c55e !important;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5), inset 0 0 5px rgba(34, 197, 94, 0.3); color: var(--text-dark); cursor: pointer; transition: transform 0.2s ease; overflow: hidden;
        }
        .player-card:hover { transform: translateY(-2px); box-shadow: 0 0 18px rgba(34, 197, 94, 0.8); }
        .player-card.rank-card-1 { background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%) !important; border-color: #fef08a !important; }
        .player-card.rank-card-2 { background: linear-gradient(90deg, #e2e8f0 0%, #94a3b8 50%, #64748b 100%) !important; border-color: #ffffff !important; }
        .player-card.rank-card-2 .player-info h3, .player-card.rank-card-2 .player-info p { color: #ffffff !important; }
        .player-card.rank-card-3 { background: linear-gradient(90deg, #ffedd5 0%, #fb923c 50%, #f97316 100%) !important; border-color: #ffedd5 !important; }
        .player-card.rank-card-3 .player-info h3, .player-card.rank-card-3 .player-info p { color: #ffffff !important; }

        .festive-rank-badge { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900; position: relative; }
        .festive-rank-badge.rank-1::before { content: '🟡'; position: absolute; font-size: 2.2rem; z-index: 1; }
        .festive-rank-badge.rank-2::before { content: '🔔'; position: absolute; font-size: 2.2rem; z-index: 1; }
        .festive-rank-badge.rank-3::before { content: '⭐'; position: absolute; font-size: 2.2rem; z-index: 1; }
        .festive-rank-badge span { position: relative; z-index: 2; color: #000; font-size: 1rem; }

        .mctiers-badge-wrapper {
            display: flex; align-items: center; height: 58px; width: 155px; background: rgba(15, 23, 42, 0.2); border-radius: 6px; overflow: hidden; border: 1px solid rgba(0, 0, 0, 0.15); flex-shrink: 0; padding: 0 2px;
        }
        .rank-number-box { width: 38px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 900; color: var(--text-dark); flex-shrink: 0; }
        .skin-holder { width: 112px; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgba(0, 0, 0, 0.05); }
        .head-avatar-img { width: 100%; height: 54px; object-fit: contain; image-rendering: pixelated; }

        .player-info { flex: 1 1 150px; min-width: 130px; }
        .player-info h3 { font-size: 1.15rem; font-weight: 800; color: #0f172a; }
        .player-info p { font-size: 0.85rem; color: #334155; font-weight: 700; }

        .region-badge, .platform-badge {
            padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 800; background: rgba(15, 23, 42, 0.85); border: 1px solid #22c55e; color: #86efac; flex-shrink: 0;
        }
        .region-badge.region-na { border: 1px solid #ef4444 !important; color: #fca5a5 !important; }
        .platform-badge { border: 1px solid #3b82f6; color: #93c5fd; }
        .platform-badge.pojav { border: 1px solid #a855f7; color: #e9d5ff; }

        .tier-badges { display: flex; flex-wrap: wrap; gap: 6px; flex: 2 1 200px; }
        .badge {
            background: rgba(15, 23, 42, 0.9); border: 1.5px solid var(--tier-color, #38bdf8); padding: 5px 10px; border-radius: 6px; font-size: 0.82rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; color: var(--tier-color, #38bdf8); box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .badge img { width: 18px; height: 18px; object-fit: contain; }
        .badge.tier-HT1 { --tier-color: #ef4444; } .badge.tier-LT1 { --tier-color: #f87171; }
        .badge.tier-HT2 { --tier-color: #f97316; } .badge.tier-LT2 { --tier-color: #fb923c; }
        .badge.tier-HT3 { --tier-color: #f59e0b; } .badge.tier-LT3 { --tier-color: #fbbf24; }
        .badge.tier-HT4 { --tier-color: #eab308; } .badge.tier-LT4 { --tier-color: #fde047; }
        .badge.tier-HT5 { --tier-color: #84cc16; } .badge.tier-LT5 { --tier-color: #22c55e; }

        .actions { display: flex; gap: 4px; margin-left: auto; z-index: 5; }
        .btn-sm { padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; border: none; color: white; cursor: pointer; }
        .btn-edit { background: #166534; } .btn-delete { background: #ef4444; }

        footer { text-align: center; padding: 20px 10px; margin-top: 30px; background: rgba(15, 56, 34, 0.7); border-radius: 12px; border: 1px solid #166534; }
        .christmas-footer-graphic { font-size: 2.2rem; margin-bottom: 10px; }
        .christmas-footer-text { font-size: 1rem; font-weight: 800; color: #86efac; text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }

        /* Modal & Custom Dialog Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 99999; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(6px); }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #0f3822; border: 2px solid #22c55e; border-radius: 16px; width: 100%; max-width: 440px; padding: 25px; position: relative; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .modal-close { position: absolute; top: 12px; right: 15px; background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; }
        .modal-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .modal-avatar { width: 75px; height: 85px; border-radius: 8px; image-rendering: pixelated; object-fit: contain; background: rgba(0,0,0,0.3); padding: 4px; border: 1px solid rgba(255,255,255,0.2); }
        .modal-header h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
        .modal-header p { font-size: 0.9rem; color: #cbd5e1; font-weight: 700; }
        .modal-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .modal-stat-box { background: var(--bg-input); padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; font-weight: 700; border: 1px solid #166534; }
        .modal-stat-kit { display: flex; align-items: center; gap: 6px; }
        .modal-stat-kit img { width: 18px; height: 18px; object-fit: contain; }

        .custom-dialog-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999999; display: none; align-items: center; justify-content: center; padding: 20px; }
        .custom-dialog-overlay.active { display: flex; }
        .custom-dialog-card { background: #0f2c1c; border: 2px solid #22c55e; border-radius: 16px; width: 100%; max-width: 320px; padding: 20px; text-align: center; color: #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.9); }
        .custom-dialog-card h3 { font-size: 1.2rem; margin-bottom: 10px; color: #86efac; }
        .custom-dialog-card p { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 15px; }
        .custom-dialog-input { width: 100%; padding: 10px; background: #113824; border: 1px solid #166534; border-radius: 8px; color: white; margin-bottom: 15px; outline: none; text-align: center; font-size: 1rem; }
        .custom-dialog-btns { display: flex; gap: 10px; justify-content: center; }
        .custom-dialog-btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 0.9rem; flex: 1; }
        .custom-dialog-btn.cancel { background: #166534; color: #fff; }
        .custom-dialog-btn.confirm { background: #22c55e; color: #000; }
    </style>
</head>
<body>

    <div class="snowfall-bg"></div>

    <div class="christmas-title-banner">
        <div class="christmas-title-text">BRUTETIERS</div>
    </div>

    <header>
        <div class="logo">BRUTE<span>TIERS</span></div>
        <div class="header-btns">
            <a href="https://discord.gg/BAjzj8qmmk" target="_blank" class="btn btn-discord">Discord</a>
            <button class="btn" id="adminToggleBtn" onclick="toggleAdmin()">⚙ Admin</button>
            <button class="btn btn-logout" id="logoutBtn" onclick="logoutAdmin()">Logout</button>
        </div>
    </header>

    <div class="search-filter-bar">
        <div class="search-box">
            <input type="text" id="searchPlayer" placeholder="Search player..." oninput="renderLeaderboard()">
        </div>
        
        <div class="platform-filter">
            <div class="custom-select-box" id="platformSelectTrigger" onclick="openAndroidMenu('platform')">All Platforms</div>
            <div class="android-dropdown-menu" id="platformDropdownMenu" onclick="closeAndroidMenu(event, 'platform')">
                <div class="android-dropdown-card" onclick="event.stopPropagation()">
                    <div class="android-dropdown-title">Select Platform</div>
                    <div class="android-dropdown-option selected" data-value="ALL" onclick="selectPlatformOption('ALL', 'All Platforms')"><span>All Platforms</span><div class="android-radio-circle"></div></div>
                    <div class="android-dropdown-option" data-value="PC" onclick="selectPlatformOption('PC', 'PC')"><span>PC</span><div class="android-radio-circle"></div></div>
                    <div class="android-dropdown-option" data-value="Pojav" onclick="selectPlatformOption('Pojav', 'Pojav')"><span>Pojav</span><div class="android-radio-circle"></div></div>
                </div>
            </div>
        </div>

        <div class="region-filter">
            <div class="custom-select-box" id="regionSelectTrigger" onclick="openAndroidMenu('region')">All Regions</div>
            <div class="android-dropdown-menu" id="regionDropdownMenu" onclick="closeAndroidMenu(event, 'region')">
                <div class="android-dropdown-card" id="regionDropdownCardContainer" onclick="event.stopPropagation()">
                    <div class="android-dropdown-title">Select Region</div>
                    <div class="android-dropdown-option selected" data-value="ALL" onclick="selectRegionOption('ALL', 'All Regions')"><span>All Regions</span><div class="android-radio-circle"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="podium-container" id="podiumContainer"></div>
    <div class="podium-divider-strip" id="podiumDivider"></div>
    <div class="kit-bar" id="kitBar"></div>

    <div class="admin-panel" id="adminPanel">
        <h2>Admin Management Panel</h2>
        
        <div style="background: rgba(6, 36, 20, 0.7); padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #22c55e;">
            <h3 style="font-size: 0.95rem; margin-bottom: 8px; color: #86efac;">➕ Add New Gamemode</h3>
            <form id="gamemodeForm" onsubmit="addNewGamemode(event)" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                <div style="flex: 1 1 150px;">
                    <input type="text" id="newGamemodeName" placeholder="Gamemode Name (e.g. Cart)" required>
                </div>
                <div style="flex: 1 1 180px;">
                    <input type="file" id="newGamemodeIcon" accept="image/*" required onchange="handleNewGamemodeIcon(event)">
                    <input type="hidden" id="newGamemodeIconBase64">
                </div>
                <div>

    <!-- Custom Confirm / Alert Dialog -->

        <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9AWX1TEymQXn20Ech-ZZVXQsRwS35kzY",
            authDomain: "brute-tiers.firebaseapp.com",
            databaseURL: "https://brute-tiers-default-rtdb.firebaseio.com",
            projectId: "brute-tiers",
            storageBucket: "brute-tiers.firebasestorage.app",
            messagingSenderId: "35511970184",
            appId: "1:35511970184:web:6f796e44d8567bdfe8f23d",
            measurementId: "G-CVENNS4GJ6"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const globalRef = db.ref("brutetiers_data");
        const rootRef = db.ref();

        let ALL_CATEGORIES = ['Overall', 'Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        let KITS = ['Sword', 'Axe', 'NethPot', 'DiaPot', 'UHC', 'Smp', 'Lifesteal', 'Mace', 'Crystal'];
        
        const TIERS = ['NA', 'HT1', 'LT1', 'HT2', 'LT2', 'HT3', 'LT3', 'HT4', 'LT4', 'HT5', 'LT5'];
        const ADMIN_PASS = "98909890";
        let isAdminLoggedIn = false;
        let selectedCategory = 'Overall';
        let currentPlatformFilter = 'ALL';
        let currentRegionFilter = 'ALL';
        let dialogCallback = null;

        const TIER_ORDER = { 
            'HT1': 1, 'LT1': 2, 'HT2': 3, 'LT2': 4, 'HT3': 5, 
            'LT3': 6, 'HT4': 7, 'LT4': 8, 'HT5': 9, 'LT5': 10, 'NA': 99 
        };

        const TIER_SCORES = { 
            'HT1': 100, 'LT1': 90, 'HT2': 80, 'LT2': 70, 'HT3': 60, 
            'LT3': 50, 'HT4': 40, 'LT4': 30, 'HT5': 20, 'LT5': 10, 'NA': 0 
        };

        let appData = { kitIcons: {}, playersList: [] };
        let isDataLoaded = false;

        function processSnapshotData(rawVal) {
            if (!rawVal) return null;
            let list = [];
            let icons = {};
            let customCats = [];

            if (Array.isArray(rawVal.playersList)) {
                list = rawVal.playersList;
            } else if (Array.isArray(rawVal)) {
                list = rawVal;
            } else if (rawVal.brutetiers_data && Array.isArray(rawVal.brutetiers_data.playersList)) {
                list = rawVal.brutetiers_data.playersList;
            } else {
                for (let k in rawVal) {
                    if (rawVal[k]) {
                        if (Array.isArray(rawVal[k].playersList)) {
                            list = rawVal[k].playersList;
                            icons = rawVal[k].kitIcons || {};
                            if (Array.isArray(rawVal[k].customCategories)) customCats = rawVal[k].customCategories;
                            break;
                        } else if (Array.isArray(rawVal[k])) {
                            list = rawVal[k];
                            break;
                        }
                    }
                }
            }

            if (rawVal.kitIcons) icons = rawVal.kitIcons;
            else if (rawVal.brutetiers_data && rawVal.brutetiers_data.kitIcons) icons = rawVal.brutetiers_data.kitIcons;

            if (rawVal.customCategories && Array.isArray(rawVal.customCategories)) customCats = rawVal.customCategories;
            else if (rawVal.brutetiers_data && Array.isArray(rawVal.brutetiers_data.customCategories)) customCats = rawVal.brutetiers_data.customCategories;

            return { playersList: list, kitIcons: icons, customCategories: customCats };
        }

        rootRef.on('value', (snapshot) => {
            isDataLoaded = true;
            const val = snapshot.val();
            const parsed = processSnapshotData(val);

            if (parsed) {
                appData = {
                    kitIcons: parsed.kitIcons || {},
                    playersList: parsed.playersList || []
                };
                if (parsed.customCategories && parsed.customCategories.length > 0) {
                    ALL_CATEGORIES = ['Overall', ...parsed.customCategories];
                    KITS = [...parsed.customCategories];
                }
            }
            renderAll();
        }, (error) => {
            console.error("Firebase Read Error:", error);
            isDataLoaded = true;
            renderAll();
        });

        function renderAll() {
            updateRegionDropdownMenu();
            renderKitBar();
            renderKitRepsManager();
            buildTierInputs();
            renderPodium();
            renderLeaderboard();
        }

        function openAndroidMenu(type) {
            document.getElementById(type + 'DropdownMenu').classList.add('active');
        }
        function closeAndroidMenu(event, type) {
            document.getElementById(type + 'DropdownMenu').classList.remove('active');
        }
        function selectPlatformOption(val, labelText) {
            currentPlatformFilter = val;
            document.getElementById('platformSelectTrigger').textContent = labelText;
            document.querySelectorAll('#platformDropdownMenu .android-dropdown-option').forEach(el => {
                if (el.getAttribute('data-value') === val) el.classList.add('selected');
                else el.classList.remove('selected');
            });
            document.getElementById('platformDropdownMenu').classList.remove('active');
            renderLeaderboard();
        }
        function selectRegionOption(val, labelText) {
            currentRegionFilter = val;
            document.getElementById('regionSelectTrigger').textContent = labelText;
            document.querySelectorAll('#regionDropdownMenu .android-dropdown-option').forEach(el => {
                if (el.getAttribute('data-value') === val) el.classList.add('selected');
                else el.classList.remove('selected');
            });
            document.getElementById('regionDropdownMenu').classList.remove('active');
            renderLeaderboard();
        }

        function updateRegionDropdownMenu() {
            const cardContainer = document.getElementById('regionDropdownCardContainer');
            if (!cardContainer) return;
            
            let regionsSet = new Set();
            if (appData.playersList) {
                appData.playersList.forEach(p => {
                    if (p && p.region) {
                        regionsSet.add(p.region.trim().toUpperCase());
                    }
                });
            }

            let optionsHtml = `<div class="android-dropdown-title">Select Region</div>`;
            optionsHtml += `
                <div class="android-dropdown-option ${currentRegionFilter === 'ALL' ? 'selected' : ''}" data-value="ALL" onclick="selectRegionOption('ALL', 'All Regions')">
                    <span>All Regions</span><div class="android-radio-circle"></div>
                </div>`;
            
            Array.from(regionsSet).sort().forEach(reg => {
                optionsHtml += `
                    <div class="android-dropdown-option ${currentRegionFilter === reg ? 'selected' : ''}" data-value="${reg}" onclick="selectRegionOption('${reg}', '${reg}')">
                        <span>${reg}</span><div class="android-radio-circle"></div>
                    </div>`;
            });

            cardContainer.innerHTML = optionsHtml;
        }

        async function saveGlobalData() {
            renderAll();
            try {
                const customCats = ALL_CATEGORIES.filter(c => c !== 'Overall');
                await globalRef.set({
                    kitIcons: appData.kitIcons || {},
                    playersList: appData.playersList || [],
                    customCategories: customCats
                });
            } catch (err) {
                console.error("Firebase Sync Error:", err);
            }
        }

        function toggleAdmin() {
            if (isAdminLoggedIn) {
                document.getElementById('adminPanel').classList.toggle('active');
            } else {
                document.getElementById('adminPasswordInput').value = '';
                document.getElementById('customPasswordDialog').classList.add('active');
                setTimeout(() => document.getElementById('adminPasswordInput').focus(), 100);
            }
        }

        function closePasswordDialog(success) {
            const passInput = document.getElementById('adminPasswordInput').value;
            document.getElementById('customPasswordDialog').classList.remove('active');
            if (success) {
                if (passInput === ADMIN_PASS) {
                    isAdminLoggedIn = true;
                    document.getElementById('adminPanel').classList.add('active');
                    document.getElementById('adminToggleBtn').textContent = "⚙ Panel";
                    document.getElementById('logoutBtn').style.display = "inline-block";
                    renderLeaderboard();
                } else {
                    showCustomDialog("Access Denied", "Incorrect Admin Password!", () => {});
                }
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminToggleBtn').textContent = "⚙ Admin";
            document.getElementById('logoutBtn').style.display = "none";
            renderLeaderboard();
        }

        function calculatePoints(playerTiers) {
            let total = 0;
            if (!playerTiers) return 0;
            KITS.forEach(kit => { total += TIER_SCORES[playerTiers[kit] || 'NA'] || 0; });
            return total;
        }

        function getDefaultTitleByRank(displayRank) {
            if (displayRank === 1) return 'Combat GrandMaster';
            if (displayRank === 2) return 'Combat GrandExpert';
            if (displayRank === 3) return 'Combat Expert';
            if (displayRank >= 4 && displayRank <= 10) return 'Combat Specialist';
            if (displayRank >= 11 && displayRank <= 50) return 'Combat Cadet';
            if (displayRank >= 51 && displayRank <= 100) return 'Experienced';
            return 'Rookie';
        }

        function renderKitBar() {
            document.getElementById('kitBar').innerHTML = ALL_CATEGORIES.map(cat => `
                <div class="kit-pill ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
                    ${appData.kitIcons && appData.kitIcons[cat] ? `<img src="${appData.kitIcons[cat]}">` : ''}
                    <span>${cat}</span>
                </div>
            `).join('');
        }

        function selectCategory(cat) { 
            if (selectedCategory === cat) return;
            selectedCategory = cat; 
            renderKitBar(); 
            renderPodium();
            renderLeaderboard();
        }

        function renderPodium() {
            const podiumContainer = document.getElementById('podiumContainer');
            const dividerStrip = document.getElementById('podiumDivider');
            
            if (!appData.playersList || appData.playersList.length === 0 || selectedCategory !== 'Overall') {
                podiumContainer.style.display = 'none';
                dividerStrip.style.display = 'none';
                return;
            }
            podiumContainer.style.display = 'flex';
            dividerStrip.style.display = 'block';

            let sortedList = [...appData.playersList].sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));
            const top3 = sortedList.slice(0, 3);

            if (top3.length === 0) {
                podiumContainer.innerHTML = '';
                dividerStrip.style.display = 'none';
                return;
            }

            let displayOrder = [];
            if (top3[1]) displayOrder.push({ player: top3[1], rank: 2 });
            if (top3[0]) displayOrder.push({ player: top3[0], rank: 1 });
            if (top3[2]) displayOrder.push({ player: top3[2], rank: 3 });

            podiumContainer.innerHTML = displayOrder.map(item => {
                const p = item.player;
                const rank = item.rank;
                const originalIndex = appData.playersList.indexOf(p);
                const pts = calculatePoints(p.tiers);
                const title = getDefaultTitleByRank(rank);
                const avatarImg = p.customSkin || `https://mc-heads.net/body/${p.username}/100`;

                return `
                    <div class="podium-card rank-${rank}" onclick="openModal(${originalIndex})">
                        ${rank === 1 ? `<div class="podium-crown">👑</div>` : ''}
                        <div class="podium-avatar-box">
                            <img src="${avatarImg}" alt="${p.username}" onerror="this.onerror=null; this.src='https://mc-heads.net/body/Steve/100';">
                        </div>
                        <div class="podium-info">
                            <h3>#${rank} ${p.username}</h3>
                            <p>${title}</p>
                            <span class="podium-points">${pts} Points</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard');

            if (!isDataLoaded) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#86efac; font-weight:700;">Loading players from database...</div>`;
                return;
            }

            if (!appData.playersList || appData.playersList.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#cbd5e1; font-weight:700;">No players found in database. Use Admin panel to add players!</div>`;
                return;
            }

            const searchQuery = document.getElementById('searchPlayer')?.value.toLowerCase().trim() || '';

            let displayList = appData.playersList.filter(p => {
                if (!p || !p.username) return false;
                const matchesName = p.username.toLowerCase().includes(searchQuery);
                const pRegion = (p.region || 'NA').trim().toUpperCase();
                const pPlatform = (p.platform || 'PC').trim();

                const matchesRegion = (currentRegionFilter === 'ALL' || pRegion === currentRegionFilter);
                const matchesPlatform = (currentPlatformFilter === 'ALL' || pPlatform.toLowerCase() === currentPlatformFilter.toLowerCase());

                return matchesName && matchesRegion && matchesPlatform;
            });

            if (selectedCategory === 'Overall') {
                displayList.sort((a, b) => calculatePoints(b.tiers) - calculatePoints(a.tiers));
            } else {
                displayList = displayList.filter(p => p.tiers && p.tiers[selectedCategory] && p.tiers[selectedCategory] !== 'NA');
                displayList.sort((a, b) => (TIER_ORDER[a.tiers[selectedCategory]] || 99) - (TIER_ORDER[b.tiers[selectedCategory]] || 99));
            }

            if (displayList.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:#cbd5e1;">No matching players found.</div>`;
                return;
            }

            container.innerHTML = displayList.map((player, index) => {
                const originalIndex = appData.playersList.indexOf(player);
                const points = calculatePoints(player.tiers);
                const displayRank = index + 1;
                const title = getDefaultTitleByRank(displayRank);
                const rankClass = displayRank <= 3 ? `rank-card-${displayRank}` : '';
                const festiveRankClass = displayRank <= 3 ? `festive-rank-badge rank-${displayRank}` : 'rank-number-box';
                
                const avatarImg = player.customSkin || `https://mc-heads.net/body/${player.username}/100`;

                const rawRegion = (player.region || '').trim().toUpperCase();
                const regionDisplay = rawRegion || 'NA';
                const regionClass = regionDisplay === 'NA' ? 'region-badge region-na' : 'region-badge';

                const platformDisplay = (player.platform || 'PC').trim();
                const platformClass = platformDisplay.toLowerCase() === 'pojav' ? 'platform-badge pojav' : 'platform-badge';

                let visibleTiersHtml = '';
                if (selectedCategory === 'Overall') {
                    visibleTiersHtml = KITS.map(kit => {
                        const tier = player.tiers ? player.tiers[kit] : 'NA';
                        const icon = appData.kitIcons ? appData.kitIcons[kit] : null;
                        return tier && tier !== 'NA' ? `
                            <span class="badge tier-${tier}">
                                ${icon ? `<img src="${icon}">` : ''}${tier}
                            </span>` : '';
                    }).join('');
                } else {
                    const tier = player.tiers ? player.tiers[selectedCategory] : 'NA';
                    const icon = appData.kitIcons ? appData.kitIcons[selectedCategory] : null;
                    if (tier && tier !== 'NA') {
                        visibleTiersHtml = `
                            <span class="badge tier-${tier}">
                                ${icon ? `<img src="${icon}">` : ''}${tier}
                            </span>`;
                    }
                }

                return `
                    <div class="player-card ${rankClass}" style="--card-index: ${index};" onclick="openModal(${originalIndex})">
                        <div class="mctiers-badge-wrapper">
                            <div class="${festiveRankClass}"><span>${displayRank}.</span></div>
                            <div class="skin-holder">
                                <img class="head-avatar-img" src="${avatarImg}" loading="lazy" alt="skin" onerror="this.onerror=null; this.src='https://mc-heads.net/body/Steve/100';">
                            </div>
                        </div>
                        <div class="player-info">
                            <h3>${player.username}</h3>
                            <p>${title} (${points} Points)</p>
                        </div>
                        <div class="${platformClass}">${platformDisplay}</div>
                        <div class="${regionClass}">${regionDisplay}</div>
                        <div class="tier-badges">
                            ${visibleTiersHtml}
                        </div>
                        ${isAdminLoggedIn ? `
                        <div class="actions" onclick="event.stopPropagation()">
                            <button class="btn-sm btn-edit" onclick="editPlayer(${originalIndex})">Edit</button>
                            <button class="btn-sm btn-delete" onclick="deletePlayer(${originalIndex})">X</button>
                        </div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function openModal(index) {
            const player = appData.playersList[index];
            if (!player) return;

            document.getElementById('modalUsername').textContent = player.username;
            const pts = calculatePoints(player.tiers);
            const displayRank = appData.playersList.indexOf(player) + 1;
            document.getElementById('modalTitle').textContent = `${getDefaultTitleByRank(displayRank)} • (${pts} Points) • [${player.platform || 'PC'}]`;
            document.getElementById('modalAvatar').src = player.customSkin || `https://mc-heads.net/body/${player.username}/100`;

            let modalKitsToDisplay = (selectedCategory === 'Overall') ? KITS : [selectedCategory];

            document.getElementById('modalStatsGrid').innerHTML = modalKitsToDisplay.map(kit => {
                const icon = appData.kitIcons ? appData.kitIcons[kit] : null;
                const tierVal = player.tiers ? player.tiers[kit] || 'NA' : 'NA';
                return `
                    <div class="modal-stat-box">
                        <div class="modal-stat-kit">
                            ${icon ? `<img src="${icon}">` : ''}
                            <span>${kit}</span>
                        </div>
                        <span class="badge tier-${tierVal}">${tierVal}</span>
                    </div>
                `;
            }).join('');

            document.getElementById('statsModal').classList.add('active');
        }

        function closeModal() { document.getElementById('statsModal').classList.remove('active'); }
        function closeModalOnOutside(e) {
            if (e.target.id === 'statsModal') closeModal();
        }

        function showCustomDialog(title, message, onConfirm) {
            document.getElementById('dialogTitle').textContent = title;
            document.getElementById('dialogMessage').textContent = message;
            dialogCallback = onConfirm;
            document.getElementById('customDialog').classList.add('active');
        }

        function closeCustomDialog(confirmed) {
            document.getElementById('customDialog').classList.remove('active');
            if (confirmed && dialogCallback) {
                dialogCallback();
            }
            dialogCallback = null;
        }

        function buildTierInputs() {
            const container = document.getElementById('tierInputsContainer');
            if (!container) return;
            container.innerHTML = KITS.map(kit => `
                <div>
                    <label style="font-size:0.75rem;">${kit}</label>
                    <select id="tier-${kit}">
                        ${TIERS.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                </div>
            `).join('');
        }

        function renderKitRepsManager() {
            const container = document.getElementById('representativesManager');
            if (!container) return;
            container.innerHTML = ALL_CATEGORIES.map(cat => `
                <div class="rep-card-input">
                    <img src="${(appData.kitIcons && appData.kitIcons[cat]) || ''}" class="rep-icon-preview">
                    <div style="flex:1;">
                        <label style="font-size:0.75rem;">${cat} Icon</label>
                        <input type="file" accept="image/*" onchange="handleKitIconUpload('${cat}', event)">
                    </div>
                </div>
            `).join('');
        }

        function handleNewGamemodeIcon(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 24; canvas.height = 24;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 24, 24);
                    document.getElementById('newGamemodeIconBase64').value = canvas.toDataURL('image/png');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function addNewGamemode(e) {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const nameInput = document.getElementById('newGamemodeName');
            const iconBase64 = document.getElementById('newGamemodeIconBase64').value;
            const gmName = nameInput.value.trim();

            if (!gmName) return;

            if (ALL_CATEGORIES.includes(gmName)) {
                showCustomDialog("Notice", "Gamemode already exists!", () => {});
                return;
            }

            ALL_CATEGORIES.push(gmName);
            KITS.push(gmName);

            if (!appData.kitIcons) appData.kitIcons = {};
            if (iconBase64) {
                appData.kitIcons[gmName] = iconBase64;
            }

            nameInput.value = '';
            document.getElementById('newGamemodeIcon').value = '';
            document.getElementById('newGamemodeIconBase64').value = '';

            await saveGlobalData();
            showCustomDialog("Success", `Gamemode "${gmName}" added successfully!`, () => {});
        }

        function handleSkinUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 32; canvas.height = 32;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = false;

                    if (img.width >= 32) {
                        ctx.drawImage(img, 8, 8, 8, 8, 0, 0, 32, 32);
                        ctx.drawImage(img, 40, 8, 8, 8, 0, 0, 32, 32);
                    } else {
                        ctx.drawImage(img, 0, 0, 32, 32);
                    }
                    
                    document.getElementById('customSkinBase64').value = canvas.toDataURL('image/png');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleKitIconUpload(category, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 24; canvas.height = 24;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 24, 24);
                        if (!appData.kitIcons) appData.kitIcons = {};
                        appData.kitIcons[category] = canvas.toDataURL('image/png');
                        renderAll();
                        await saveGlobalData();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('playerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = "Publishing Globally...";

            const editIndexVal = document.getElementById('editIndex').value;
            const editIndex = editIndexVal !== "" ? parseInt(editIndexVal) : null;
            const username = document.getElementById('username').value.trim();
            const platform = document.getElementById('platform').value;
            const region = document.getElementById('region').value.trim() || 'NA';
            const customSkin = document.getElementById('customSkinBase64').value;

            const tiers = {};
            KITS.forEach(kit => {
                const selectEl = document.getElementById(`tier-${kit}`);
                tiers[kit] = selectEl ? selectEl.value : 'NA';
            });

            let existingSkin = '';
            if (editIndex !== null && appData.playersList[editIndex]) {
                existingSkin = appData.playersList[editIndex].customSkin || '';
            }

            const playerData = { username, platform, region, customSkin: customSkin || existingSkin, tiers };

            if (!appData.playersList) appData.playersList = [];

            if (editIndex !== null && editIndex >= 0 && editIndex < appData.playersList.length) {
                appData.playersList[editIndex] = playerData;
            } else {
                const existingIdx = appData.playersList.findIndex(p => p.username.toLowerCase() === username.toLowerCase());
                if (existingIdx !== -1) {
                    appData.playersList[existingIdx] = playerData;
                } else {
                    appData.playersList.push(playerData);
                }
            }

            document.getElementById('playerForm').reset();
            document.getElementById('editIndex').value = '';
            document.getElementById('customSkinBase64').value = '';

            await saveGlobalData();

            saveBtn.disabled = false;
            saveBtn.textContent = "Save Player";
            toggleAdmin();
        });

        function editPlayer(index) {
            const player = appData.playersList[index];
            if (!player) return;
            document.getElementById('editIndex').value = index;
            document.getElementById('username').value = player.username;
            document.getElementById('platform').value = player.platform || 'PC';
            document.getElementById('region').value = player.region || 'NA';
            document.getElementById('customSkinBase64').value = player.customSkin || '';

            KITS.forEach(kit => {
                const el = document.getElementById(`tier-${kit}`);
                if (el) {
                    el.value = (player.tiers && player.tiers[kit]) ? player.tiers[kit] : 'NA';
                }
            });

            if (!document.getElementById('adminPanel').classList.contains('active')) toggleAdmin();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deletePlayer(index) {
            showCustomDialog("Delete Player", "Are you sure you want to delete this player?", async () => {
                appData.playersList.splice(index, 1);
                await saveGlobalData();
            });
        }

        buildTierInputs();
    </script>
</body>
</html>
