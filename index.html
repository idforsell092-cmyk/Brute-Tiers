<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCTiers Leaderboard</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #14161d;
      --accent: #55ff55;
      --text: #efeff1;
      --subtext: #8e8e9e;
      --border: #232631;
      --danger: #ff4545;
    }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); margin-bottom: 15px; }
    h1 { margin: 0; font-size: 22px; font-weight: 800; }
    h1 span { color: var(--accent); }
    
    .admin-toggle-btn { background: #1f2330; border: 1px solid var(--border); color: var(--subtext); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

    /* Gamemode Bar */
    .gm-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .gm-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--subtext); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .gm-btn img { width: 16px; height: 16px; object-fit: contain; }

    /* Leaderboard Table Structure */
    .table-header { display: grid; grid-template-columns: 40px 1fr 60px 1.2fr; font-size: 11px; color: var(--subtext); font-weight: bold; text-transform: uppercase; padding: 8px; border-bottom: 1px solid var(--border); }
    .lb-container { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .player-row { display: grid; grid-template-columns: 40px 1fr 60px 1.2fr; align-items: center; background: var(--card-bg); border: 1px solid var(--border); padding: 8px; border-radius: 6px; position: relative; }
    
    .rank-num { font-weight: bold; font-style: italic; font-size: 16px; color: #fff; }
    .p-info { display: flex; align-items: center; gap: 10px; }
    .p-skin { width: 32px; height: 42px; object-fit: contain; }
    .p-name { font-weight: bold; font-size: 14px; color: #fff; }
    .p-sub { font-size: 11px; color: var(--subtext); }

    .region-tag { background: #281d1d; color: #ff5555; border: 1px solid #4a2828; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-align: center; width: max-content; }
    .region-tag.EU { background: #1d281e; color: #55ff55; border-color: #284a2b; }
    .region-tag.ME { background: #28261d; color: #ffaa00; border-color: #4a4228; }

    .tiers-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tier-badge { background: #1a1d26; border: 1px solid var(--border); padding: 3px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: bold; }
    .tier-badge img { width: 14px; height: 14px; object-fit: contain; }
    .tier-val { color: #ffaa00; }

    /* Admin Action Controls */
    .action-btns { display: none; gap: 4px; position: absolute; right: 8px; top: 8px; }
    .admin-active .action-btns { display: flex; }
    .btn-act { background: #222; border: 1px solid #444; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    .btn-del { color: var(--danger); border-color: var(--danger); }

    /* Admin Panel Styling */
    .admin-panel { background: var(--card-bg); border: 1px solid #333; padding: 15px; border-radius: 8px; display: none; flex-direction: column; gap: 12px; margin-bottom: 15px; }
    .admin-panel.active { display: flex; }
    .admin-panel h3 { margin: 0; color: var(--accent); font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: var(--subtext); }
    .form-group input, .form-group select { background: #0b0c10; border: 1px solid var(--border); color: #fff; padding: 7px; border-radius: 4px; font-size: 12px; }
    .btn-main { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }

    /* Image Drop Zone Styling */
    .drop-zone { border: 2px dashed var(--border); border-radius: 6px; padding: 10px; text-align: center; font-size: 11px; color: var(--subtext); cursor: pointer; background: #0b0c10; transition: border 0.2s; }
    .drop-zone:hover { border-color: var(--accent); }
    .file-input { display: none; }
  </style>
</head>
<body>

  <header>
    <h1 id="siteTitle">BRUTE <span>TIERS</span></h1>
    <button class="admin-toggle-btn" onclick="toggleAdminPanel()">⚙️ Admin Panel</button>
  </header>

  <!-- Admin Panel -->
  <div class="admin-panel" id="adminPanel">
    <h3>⚙️ Admin Control Center</h3>
    
    <!-- Title Edit -->
    <div class="form-group">
      <label>Server/Website Name</label>
      <div style="display:flex; gap: 6px;">
        <input type="text" id="titleInput" placeholder="BRUTE TIERS" style="flex:1;">
        <button class="btn-main" onclick="saveTitle()">Save Title</button>
      </div>
    </div>

    <!-- Gamemode Add/Remove -->
    <div style="border-top:1px solid var(--border); padding-top:10px;" class="form-group">
      <label style="font-size:12px; font-weight:bold; color:var(--accent);">Gamemode Manager</label>
      <input type="text" id="newGmName" placeholder="Gamemode Name (e.g. Pot)">
      <input type="text" id="newGmIcon" placeholder="Icon Image URL (or upload image below)">
      
      <!-- Image Drop / File Picker Area -->
      <div class="drop-zone" onclick="document.getElementById('gmFileInput').click()">
        📁 Tap to Select/Upload Gamemode Image
      </div>
      <input type="file" id="gmFileInput" class="file-input" accept="image/*" onchange="handleFileUpload(event)">

      <button class="btn-main" onclick="addGamemode()" style="margin-top:4px;">Add GM</button>
      <div id="gmRemoveList" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;"></div>
    </div>

    <!-- Add/Edit Player -->
    <div style="border-top:1px solid var(--border); padding-top:10px;" class="form-group">
      <label style="font-size:12px; font-weight:bold; color:var(--accent);" id="formModeTitle">Add / Edit Player</label>
      <input type="hidden" id="editingPlayerId">
      
      <div style="display:flex; gap:6px;">
        <input type="text" id="pName" placeholder="Minecraft Username" style="flex:1;">
        <input type="text" id="pRegion" placeholder="Region (NA, EU, ME)" style="flex:1;">
      </div>

      <!-- Custom Skin URL Input -->
      <input type="text" id="pSkinUrl" placeholder="Custom Skin URL (SkinsRestorer link / Imgur / Leave blank for default skin)">

      <input type="text" id="pSub" placeholder="Title (e.g. Combat Master)">

      <div style="display:flex; gap:6px;">
        <select id="pGmSelect" style="flex:1;"></select>
        <input type="text" id="pTierVal" placeholder="Tier Text (e.g. HT1, LT2)" style="flex:1;">
      </div>

      <button class="btn-main" onclick="savePlayer()" style="margin-top:6px;">Save Player to Leaderboard</button>
    </div>
  </div>

  <!-- Gamemodes Bar -->
  <div class="gm-bar" id="gmBar"></div>

  <!-- Table Header -->
  <div class="table-header">
    <div>#</div>
    <div>Player</div>
    <div>Region</div>
    <div>Tiers</div>
  </div>

  <!-- Leaderboard Output -->
  <div class="lb-container" id="lbContainer"></div>

  <script>
    const ADMIN_PASS = "98909890";

    // Default Gamemodes
    const defaultGamemodes = [
      { id: 'sword', name: 'Sword', icon: 'https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png' },
      { id: 'vanilla', name: 'Vanilla', icon: 'https://minecraft.wiki/images/Netherite_Crystal_JE2.png' },
      { id: 'pot', name: 'Pot', icon: 'https://minecraft.wiki/images/Splashing_Healing_Potion_JE2_BE2.png' }
    ];

    // Default Players
    const defaultPlayers = [
      { id: '1', name: 'Marlowww', skinUrl: '', region: 'NA', sub: 'Combat Grandmaster', tiers: { sword: 'HT1', pot: 'LT1' } },
      { id: '2', name: 'ItzRealMe', skinUrl: '', region: 'EU', sub: 'Combat Master', tiers: { sword: 'HT3', vanilla: 'LT2' } }
    ];

    let gamemodes = JSON.parse(localStorage.getItem('mct_gms')) || defaultGamemodes;
    let players = JSON.parse(localStorage.getItem('mct_players')) || defaultPlayers;
    let isAdmin = false;

    // Load Title
    const savedTitle = localStorage.getItem('mct_title');
    if (savedTitle) document.getElementById('siteTitle').innerHTML = savedTitle;

    function renderAll() {
      renderGamemodes();
      renderLeaderboard();
    }

    function renderGamemodes() {
      const bar = document.getElementById('gmBar');
      const select = document.getElementById('pGmSelect');
      const rmList = document.getElementById('gmRemoveList');

      bar.innerHTML = '';
      select.innerHTML = '';
      rmList.innerHTML = '';

      gamemodes.forEach(gm => {
        bar.innerHTML += `<div class="gm-btn"><img src="${gm.icon}" onerror="this.style.display='none'"> ${gm.name}</div>`;
        select.innerHTML += `<option value="${gm.id}">${gm.name}</option>`;
        rmList.innerHTML += `<button class="btn-act btn-del" onclick="removeGamemode('${gm.id}')">✕ ${gm.name}</button>`;
      });
    }

    function renderLeaderboard() {
      const container = document.getElementById('lbContainer');
      container.innerHTML = '';

      if (isAdmin) container.classList.add('admin-active');
      else container.classList.remove('admin-active');

      players.forEach((p, idx) => {
        let tiersHTML = '';
        for (const [gmId, tierVal] of Object.entries(p.tiers)) {
          const gm = gamemodes.find(g => g.id === gmId);
          if (gm) {
            tiersHTML += `
              <div class="tier-badge">
                <img src="${gm.icon}">
                <span class="tier-val">${tierVal}</span>
              </div>
            `;
          }
        }

        // Use custom skin URL if provided, otherwise default to mc-heads
        const skinSrc = (p.skinUrl && p.skinUrl.trim() !== '') ? p.skinUrl : `https://mc-heads.net/body/${p.name}/40`;

        container.innerHTML += `
          <div class="player-row">
            <div class="rank-num">${idx + 1}.</div>
            <div class="p-info">
              <img class="p-skin" src="${skinSrc}" alt="${p.name}" onerror="this.src='https://mc-heads.net/body/Steve/40'">
              <div>
                <div class="p-name">${p.name}</div>
                <div class="p-sub">${p.sub || 'Member'}</div>
              </div>
            </div>
            <div>
              <span class="region-tag ${p.region}">${p.region || 'NA'}</span>
            </div>
            <div class="tiers-list">${tiersHTML}</div>
            
            <div class="action-btns">
              <button class="btn-act" onclick="editPlayer('${p.id}')">Edit</button>
              <button class="btn-act btn-del" onclick="deletePlayer('${p.id}')">✕</button>
            </div>
          </div>
        `;
      });
    }

    function toggleAdminPanel() {
      if (!isAdmin) {
        const pass = prompt("Enter Admin Password:");
        if (pass !== ADMIN_PASS) return alert("Incorrect Password!");
        isAdmin = true;
      } else {
        isAdmin = false;
      }
      document.getElementById('adminPanel').classList.toggle('active', isAdmin);
      renderLeaderboard();
    }

    function saveTitle() {
      const val = document.getElementById('titleInput').value.trim();
      if (!val) return;
      const parts = val.split(' ');
      let titleHTML = val;
      if (parts.length > 1) {
        const last = parts.pop();
        titleHTML = `${parts.join(' ')} <span>${last}</span>`;
      }
      document.getElementById('siteTitle').innerHTML = titleHTML;
      localStorage.setItem('mct_title', titleHTML);
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('newGmIcon').value = e.target.result;
        alert("Image uploaded successfully!");
      };
      reader.readAsDataURL(file);
    }

    function addGamemode() {
      const name = document.getElementById('newGmName').value.trim();
      const icon = document.getElementById('newGmIcon').value.trim();
      if (!name) return alert('Enter Gamemode Name!');

      const id = name.toLowerCase().replace(/\s+/g, '');
      gamemodes.push({ id, name, icon: icon || 'https://minecraft.wiki/images/Diamond_JE3_BE3.png' });
      localStorage.setItem('mct_gms', JSON.stringify(gamemodes));
      renderAll();
      document.getElementById('newGmName').value = '';
      document.getElementById('newGmIcon').value = '';
      document.getElementById('gmFileInput').value = '';
    }

    function removeGamemode(id) {
      gamemodes = gamemodes.filter(g => g.id !== id);
      localStorage.setItem('mct_gms', JSON.stringify(gamemodes));
      renderAll();
    }

    function savePlayer() {
      const editId = document.getElementById('editingPlayerId').value;
      const name = document.getElementById('pName').value.trim();
      const skinUrl = document.getElementById('pSkinUrl').value.trim();
      const region = document.getElementById('pRegion').value.trim().toUpperCase();
      const sub = document.getElementById('pSub').value.trim();
      const gmId = document.getElementById('pGmSelect').value;
      const tierVal = document.getElementById('pTierVal').value.trim();

      if (!name) return alert('Enter Minecraft Username!');

      if (editId) {
        // Edit Existing
        const p = players.find(x => x.id === editId);
        if (p) {
          p.name = name;
          p.skinUrl = skinUrl;
          p.region = region;
          p.sub = sub;
          if (tierVal) p.tiers[gmId] = tierVal;
        }
      } else {
        // Add New
        const existing = players.find(x => x.name.toLowerCase() === name.toLowerCase());
        if (existing) {
          existing.skinUrl = skinUrl;
          existing.region = region;
          existing.sub = sub;
          if (tierVal) existing.tiers[gmId] = tierVal;
        } else {
          const newP = {
            id: Date.now().toString(),
            name,
            skinUrl,
            region,
            sub,
            tiers: {}
          };
          if (tierVal) newP.tiers[gmId] = tierVal;
          players.push(newP);
        }
      }

      localStorage.setItem('mct_players', JSON.stringify(players));
      resetPlayerForm();
      renderLeaderboard();
    }

    function editPlayer(id) {
      const p = players.find(x => x.id === id);
      if (!p) return;
      document.getElementById('editingPlayerId').value = p.id;
      document.getElementById('pName').value = p.name;
      document.getElementById('pSkinUrl').value = p.skinUrl || '';
      document.getElementById('pRegion').value = p.region || '';
      document.getElementById('pSub').value = p.sub || '';
      document.getElementById('formModeTitle').innerText = 'Editing Player: ' + p.name;
    }

    function deletePlayer(id) {
      players = players.filter(x => x.id !== id);
      localStorage.setItem('mct_players', JSON.stringify(players));
      renderLeaderboard();
    }

    function resetPlayerForm() {
      document.getElementById('editingPlayerId').value = '';
      document.getElementById('pName').value = '';
      document.getElementById('pSkinUrl').value = '';
      document.getElementById('pRegion').value = '';
      document.getElementById('pSub').value = '';
      document.getElementById('pTierVal').value = '';
      document.getElementById('formModeTitle').innerText = 'Add / Edit Player';
    }

    renderAll();
  </script>
</body>
</html>
